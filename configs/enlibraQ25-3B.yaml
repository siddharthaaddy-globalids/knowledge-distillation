# ===========================================================================
#  enLibra space curriculum - Qwen2.5-3B (SFT) -> Qwen2.5-1.5B  [rented GPU]
#
#    ./run.sh --config configs/enlibraQ25-3B.yaml
#
#  The laptop counterpart is configs/enlibraQ25-3B-smoke.yaml, which changes one
#  thing: how much of the corpus it trains on. Same teacher, same student, same
#  everything else.
#
#  WHY A SECOND PAIR OF PROFILES
#  -----------------------------
#  configs/enlibraQ3-8B.yaml distils the RL-tuned 8B teacher. This one distils
#  the SFT teacher from a different curriculum run, which is roughly half the
#  size - so it fits a far cheaper GPU, and is the sensible thing to try first.
#  The two are separate files rather than one file with switches because a run
#  should be describable by the single path you pointed at.
#
#  WHY BOTH MODELS ARE QWEN2.5, NOT QWEN3
#  --------------------------------------
#  The teacher is an SFT of Qwen2.5-3B-Instruct, so the student is Qwen2.5-1.5B
#  and not the Qwen3-1.7B the other profiles use. Standard GKD trains the
#  student to match the teacher's distribution over the SAME vocabulary; the
#  moment the two disagree about what token id 151667 means, the JSD it
#  minimises is comparing different things.
#
#  Measured, rather than assumed: Qwen2.5-3B-Instruct has 151665 tokens and
#  Qwen3-1.7B has 151669 - the same ids for all 151665 they share, plus
#  <think>, </think>, <tool_response> and </tool_response> that only Qwen3
#  knows. A Qwen3 student is therefore not impossible, but it drags in Qwen3's
#  chat template, which writes <think> into every rendered exchange - ids the
#  Qwen2.5 teacher has no trained embedding for. Staying inside one model family
#  removes the whole question.
#
#  A NOTE ON THE MEMORY ESTIMATE
#  -----------------------------
#  It can UNDER-report for an s3:// teacher. kd.paths reads parameter counts
#  from the Hub, and a checkpoint fetched into a local cache has no Hub entry -
#  so the `weights` figure preflight prints may cover the student alone. Check
#  the size of the download itself if it matters.
# ===========================================================================
extends: _base.yaml

project:
  name: enlibra-q3-sft-to-1.7b

models:
  # The SFT-stage teacher, merged, in object storage. Preflight fetches it into
  # s3.cache_dir before anything tries to load it - which is what turns a bad
  # credential into a two-second failure rather than a forty-minute one.
  #
  # If this prefix turns out to hold a LoRA adapter rather than a whole model -
  # an adapter_config.json and a few hundred MB, not several GB - it belongs in
  # teacher_adapter instead, against whichever stock base it was trained on:
  #
  #     teacher: Qwen/Qwen3-4B
  #     teacher_adapter: s3://enlibra/dss/dev/runs/9eb5db9e-.../outputs/models/sft/
  #
  # That form is better whenever you have the choice: a merged export written by
  # another framework often keeps that framework's key layout, and transformers
  # does not raise on keys it cannot map - it randomly initialises them and
  # warns. The teacher-check stage exists to catch exactly that, and it is a
  # gate, so a teacher that fails it stops the run before any budget is spent.
  teacher: s3://enlibra/dss/dev/runs/9eb5db9e-efe4-4c8d-9f6d-3adf665a44b9/outputs/models/sft/
  # INSTRUCT, not the base model, and matching the teacher's lineage: the
  # teacher is an SFT of Qwen2.5-3B-Instruct.
  #
  # A base model has never been taught to stop. It emits no end-of-turn token,
  # so every benchmark probe and every arena question runs to its full ceiling
  # instead of finishing in a few hundred tokens - and the arena scores those as
  # "unanswered" rather than as wrong, which understates the student for a
  # reason that has nothing to do with what it learned. Observed directly: the
  # base student produced one correct sentence and then several thousand tokens
  # of rare-token drift, because repetition_penalty pushes a model with nowhere
  # to stop into progressively stranger choices.
  #
  # A base student is the better blank slate for overwriting a persona, which is
  # the one thing it would have bought here. It is not worth the rest.
  student: Qwen/Qwen2.5-1.5B-Instruct

  # The student's own tokenizer. Every Qwen2.5 shares one vocabulary, so this
  # only decides which chat template renders the corpus - and the instruct
  # template is the one both models were trained against.
  #
  # Not "teacher": that is a custom export, and a merged checkpoint's tokenizer
  # files are the part of it least worth trusting.
  tokenizer: student

hardware:
  device: auto
  dtype: bfloat16

dataset:
  # Committed to the repository, so a pod gets the corpus from `git clone` with
  # no download and no credentials. The teacher is the only thing this profile
  # fetches from object storage.
  source: ./data/enlibra-curriculum

  # No cap. These are the budgets kd.data filters every sample against, and a
  # sample over either is dropped SILENTLY - so they sit at Qwen3's full native
  # context, where the filter can never fire. Nothing in the corpus comes close
  # (longest row: 786 tokens), and it costs nothing: max_total_tokens becomes
  # the collator's max_length, a truncation ceiling rather than an allocation.
  max_prompt_tokens: 32768
  max_total_tokens: 32768

  validation_size: 48

  # kd.data's built-in synthetic prompts are general-purpose calibration for a
  # general-purpose student. This student is deliberately narrow.
  include_synthetic: false

  # THE FULL CORPUS - 1095 rows. This is the only thing the -smoke profile
  # changes, so keep the domain NAMES stable: that file overrides this block
  # wholesale rather than merging into it.
  #
  # eval-1to5hop.jsonl is deliberately absent. Those 137 rows are the score,
  # named by evaluation.arena_file below, and a held-out set the student trained
  # on measures nothing.
  domains:
    - name: curriculum-sft
      data_files: sft-1to3hop.jsonl
      quota: 937
      pool: 1000
    - name: curriculum-rl
      data_files: rl-1to2hop.jsonl
      quota: 143
      pool: 180
    # Fifteen distinct persona exchanges, 1.4% of the mix - almost certainly too
    # thin to survive two epochs against a thousand physics questions. There is
    # no way to weight them up from here: kd.data dedupes on the prompt, so
    # repeating a row changes nothing. The fix is more of them in the export.
    - name: identity
      data_files: identity.jsonl
      quota: 15
      pool: 20

lora:
  r: 32
  alpha: 64
  # Qwen2.5 is a standard dense transformer, so the plain Llama-style list
  # reaches every layer.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  # 1047 training rows at an effective batch of 8 is ~131 steps per epoch, so
  # this is roughly 2.3 passes. More than that on a corpus this size starts
  # memorising explanations rather than learning to produce them.
  max_steps: 300
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup: 0.05
  save_steps: 50
  save_total_limit: 2
  benchmark_every: 50

gkd:
  # OFF-POLICY, and this is the setting to understand before changing anything
  # else here.
  #
  # lmbda is the fraction of batches for which the student generates its own
  # completion before the teacher scores it. Qwen3's chat template renders the
  # prompt ending at `<|im_start|>assistant\n` but renders a complete exchange
  # with `<think>\n\n</think>\n\n` in front of the answer. On-policy, the student
  # therefore generates from a position where Qwen3 opens a real reasoning
  # chain, gets cut off at max_new_tokens mid-thought, and the teacher scores a
  # fragment. 0.0 sidesteps that entirely and is several times faster besides.
  #
  # It gives up the on-policy correction that makes GKD better than plain KD,
  # which is worth revisiting once this has produced a student worth correcting.
  lmbda: 0.0
  beta: 0.5
  temperature: 0.7
  # Unused while lmbda is 0.0. A ceiling, not a length.
  max_new_tokens: 8192
  seq_kd: false

evaluation:
  samples: 48
  report_format: html

  # The 137 held-out rows, scored by the `arena` stage right after training -
  # on the pod, where the teacher is already resident and already paid for.
  # Doing it later elsewhere means downloading the teacher again.
  #
  # Expect a lower number than the training distribution would give: these
  # questions run to 5 hops where training stops at 3, so 54 of them ask for a
  # chain a step longer than the student has ever been shown.
  arena_file: ./data/enlibra-curriculum/eval-1to5hop.jsonl
  arena_limit: null
  arena_max_new_tokens: 8192
  arena_elo_rounds: 25

# Sample generations during training, every benchmark_every steps. The most
# informative thing in the log: the student should go from noise to the
# <Explanation>/<Answer> shape within the first hundred steps or so.
benchmark_prompts:
  - Who are you?
  - Explain in two sentences what a star is formed from.

limits:
  # No wall-clock ceiling: inherited as null from _base.yaml. Training is the
  # thing this run exists to do, and a clock that kills it partway leaves a
  # checkpoint rather than an adapter. Add one for a single run if you want it.
  max_runtime_minutes: null
  max_cost_usd: 6.00
  confirm_above_usd: 2.00

s3:
  # Required, not optional: models.teacher is an s3:// URI and preflight refuses
  # to fetch it while this is false.
  enabled: true
  bucket: enlibra
  # Bundles land beside the teacher they were distilled from, in that run's own
  # outputs/ tree. kd.remote.s3.run_prefix appends `runs/<run-id>`, so a full
  # bundle URI is
  #   s3://enlibra/dss/dev/runs/9eb5db9e-.../outputs/gkd/runs/<run-id>/
  # and each run keeps its own folder rather than overwriting the last.
  prefix: dss/dev/runs/9eb5db9e-efe4-4c8d-9f6d-3adf665a44b9/outputs/gkd
  # Credentials come from the environment, never from this file. The identity
  # needs s3:ListBucket on the bucket plus s3:GetObject on the teacher prefix to
  # READ, and s3:PutObject on the prefix above to WRITE - three grants, and the
  # last one is the one people forget until a pod is already terminated.
  upload: [adapter, logs, report, metrics]

runpod:
  # Only read by `kd runpod launch`. The by-hand path - ./run.sh on a pod you
  # started yourself - ignores this block and takes its cost ceiling from
  # KD_PRICE_PER_HOUR instead.
  enabled: true
  # 3.09B + 1.54B parameters is ~8.6 GB of bfloat16 weights, so a 16 GB card
  # has room for activations on top and this run is far cheaper than the 8B
  # profile's, which needs 48 GB. Confirm against the `weights` line preflight
  # prints - and see the note at the top about it under-reporting an s3://
  # teacher - before assuming the smallest card will do.
  gpu_type: RTX A4000
  max_price_per_hour: 0.40
  spot: true
  volume_gb: 60
  container_disk_gb: 30
