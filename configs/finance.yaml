# ---------------------------------------------------------------------------
# Finance distillation - Qwen3.5-2B (finance-tuned) -> Qwen3.5-0.8B
#
#   kd pipeline --config configs/finance.yaml
#   ./distill.sh --config configs/finance.yaml
#
# Verified before writing this file:
#   * Both models exist and share vocab_size 248320, so the identical-vocabulary
#     requirement GKD imposes is satisfied.
#   * The teacher repo is a MERGED model (model.safetensors + config.json, no
#     adapter_config.json) despite the "-lora" suffix in its name, so it loads
#     directly with AutoModelForCausalLM - no PEFT wrapping needed.
#   * gbharti/finance-alpaca is Alpaca-format (instruction/input/output), NOT
#     conversational, hence `format: alpaca` below.
# ---------------------------------------------------------------------------
extends: _base.yaml

project:
  name: qwen35-finance-distillation

models:
  # The MERGED export. The sibling repo with the -lora suffix holds an MLX-format
  # adapter (lora_parameters/keys schema, adapters.safetensors), which PEFT
  # cannot load - so teacher_adapter is not an option for it.
  #
  # This checkpoint uses MLX/unsloth key naming rather than the layout
  # transformers 5.x expects, so it must be repaired before use:
  #     kd fix-teacher --config configs/finance.yaml
  # then point models.teacher at the repaired copy.
  teacher: siddhartha-addy-globalids-labs/qwen3.5-2b-finance-alpaca
  student: Qwen/Qwen3.5-0.8B
  # If the teacher is a base model plus a LoRA adapter rather than a merged
  # checkpoint, set `teacher` to the base and name the adapter here; it is merged
  # in at load time. Prefer this over a merged checkpoint written by another
  # framework: those keep that framework's key layout, which plain transformers
  # may not map back onto the architecture.
  #   teacher: Qwen/Qwen3.5-2B
  #   teacher_adapter: <org>/<adapter-repo-or-local-path>
  #
  # The teacher is the finance-tuned model, but both share the Qwen3.5 tokenizer.
  # Using the student's keeps the chat template aligned with what we generate from.
  tokenizer: student

hardware:
  # A 2B teacher plus a 0.8B student is ~11 GB of float32 weights before
  # activations. On macOS 14+ or CUDA, halve that with:
  #   --set hardware.dtype=bfloat16
  dtype: auto

dataset:
  source: gbharti/finance-alpaca
  # Measured over 3,000 rows: prompts are short (median 25 tokens, max 52) but
  # answers are long (median 199, p90 488). prompt<128 + total<=512 passes 91.2%.
  max_total_tokens: 512
  # The built-in synthetic prompts are general science/maths/logic and would
  # dilute a finance-specific run. Set true to blend them back in for format
  # retention.
  include_synthetic: false
  domains:
    - name: finance-alpaca
      config: null              # single-config dataset
      format: alpaca            # instruction / input / output -> chat turns
      instruction_column: instruction
      input_column: input
      output_column: output
      quota: 1800
      pool: 2400                # 91% pass rate, so this comfortably clears quota

lora:
  # Qwen3.5 is a HYBRID architecture, not a Llama-style decoder. Verified against
  # the loaded model, its 24 layers split as:
  #     18 x linear attention  -> linear_attn.{in_proj_qkv, in_proj_z, out_proj}
  #      6 x standard attention -> self_attn.{q_proj, k_proj, v_proj, o_proj}
  #     24 x MLP               -> mlp.{gate_proj, up_proj, down_proj}
  #
  # The base target list (q/k/v/o + gate/up/down) would miss the attention in 18
  # of the 24 layers entirely, so the linear_attn projections are added here.
  # AutoModelForCausalLM drops the checkpoint's vision tower and MTP head, so
  # these plain suffixes cannot leak adapters into them.
  target_modules:
    - in_proj_qkv     # linear-attn fused Q/K/V   (18 layers)
    - in_proj_z       # linear-attn gate          (18 layers)
    - out_proj        # linear-attn output        (18 layers)
    - q_proj          # standard attention        (6 layers)
    - k_proj
    - v_proj
    - o_proj
    - gate_proj       # MLP                       (24 layers)
    - up_proj
    - down_proj

training:
  learning_rate: 2.0e-4        # lower than the 135M run; larger model, longer answers

benchmark_prompts:
  - What is the difference between a Roth IRA and a traditional IRA?
  - How does compound interest work? Explain briefly.
  - What does it mean when a stock is described as having a high P/E ratio?
