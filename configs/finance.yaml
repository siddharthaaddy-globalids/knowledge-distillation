# ---------------------------------------------------------------------------
# Finance distillation - Qwen3.5-2B + a finance LoRA  ->  Qwen3.5-0.8B
#
#   kd pipeline --config configs/finance.yaml
#
# The teacher is assembled from a BASE MODEL PLUS A LORA ADAPTER rather than
# loaded from a merged checkpoint. That is the safer of the two forms, and it is
# what this profile is built around:
#
#   * A merged export written by another framework keeps that framework's key
#     layout. transformers does not raise when it cannot map those keys - it
#     randomly initialises whatever it could not place and loads anyway. The
#     result generates uniform noise, and GKD faithfully teaches the student to
#     reproduce it. That is precisely what happened with the merged sibling of
#     this adapter, and why `kd fix-teacher` exists.
#   * Merging here, from the canonical base, sidesteps the whole problem: PEFT
#     attaches to the live module tree, so there are no key names to mis-map.
#
# The merge happens once, at load time, before training starts. The teacher is
# frozen afterwards, so this costs nothing per step.
#
# Verified against the Hub before writing this file:
#   * Qwen/Qwen3.5-2B and Qwen/Qwen3.5-0.8B share a tokenizer, which is what
#     standard GKD requires. A LoRA does not change the vocabulary, so adding one
#     to the teacher preserves that.
#   * The published adapter is in MLX/unsloth format - `adapters.safetensors`
#     plus a `lora_parameters.keys` schema - which PEFT cannot read. Preflight
#     converts it automatically, once, and caches the result; see models below.
#   * gbharti/finance-alpaca is Alpaca-format (instruction/input/output), NOT
#     conversational, hence `format: alpaca` below.
# ---------------------------------------------------------------------------
extends: _base.yaml

project:
  name: qwen35-finance-distillation

models:
  # The canonical base. Not the merged export, and not unsloth's mirror: this is
  # the repo whose key layout transformers loads correctly.
  teacher: Qwen/Qwen3.5-2B

  # The finance LoRA, merged into the teacher at load time.
  #
  # This adapter is published in MLX/unsloth format - adapters.safetensors plus a
  # lora_parameters schema - which PEFT cannot read. It does not need converting
  # by hand: preflight notices the format and converts it once into
  # ~/.cache/kd/adapters/, then reuses that copy on every later run. The
  # conversion renames and transposes, needs no GPU, and reads only the base
  # model's config.json rather than its weights.
  #
  # A local path works here too, if you would rather convert it yourself:
  #     kd convert-adapter --adapter <this repo> --base Qwen/Qwen3.5-2B --out ./my-lora
  #     --set models.teacher_adapter=./my-lora
  teacher_adapter: siddhartha-addy-globalids-labs/qwen3.5-2b-finance-alpaca-lora

  student: Qwen/Qwen3.5-0.8B

  # Both share the Qwen3.5 tokenizer. Using the student's keeps the chat template
  # aligned with what the student actually generates from.
  tokenizer: student

hardware:
  # A 2B teacher plus a 0.8B student is ~11 GB of float32 weights before
  # activations. On CUDA or macOS 14+, halve that with:
  #   --set hardware.dtype=bfloat16
  # On CPU it is ignored - bf16 there is slow and often unstable - so a CPU box
  # needs the full 11 GB and a great deal of patience. Prefer a GPU for this pair.
  dtype: auto

dataset:
  source: gbharti/finance-alpaca
  # Measured over 3,000 rows: prompts are short (median 25 tokens, max 52) but
  # answers are long (median 199, p90 488). prompt<128 + total<=512 passes 91.2%.
  max_total_tokens: 512
  # The built-in synthetic prompts are general science/maths/logic and would
  # dilute a finance-specific run. Set true to blend them back in for format
  # retention.
  include_synthetic: false
  domains:
    - name: finance-alpaca
      config: null              # single-config dataset
      format: alpaca            # instruction / input / output -> chat turns
      instruction_column: instruction
      input_column: input
      output_column: output
      quota: 1800
      pool: 2400                # 91% pass rate, so this comfortably clears quota

lora:
  # This is the STUDENT's adapter shape, and it is independent of the teacher's.
  #
  # Qwen3.5 is a HYBRID architecture, not a Llama-style decoder. Verified against
  # the loaded model, its 24 layers split as:
  #     18 x linear attention  -> linear_attn.{in_proj_qkv, in_proj_z, out_proj}
  #      6 x standard attention -> self_attn.{q_proj, k_proj, v_proj, o_proj}
  #     24 x MLP               -> mlp.{gate_proj, up_proj, down_proj}
  #
  # The base target list (q/k/v/o + gate/up/down) would miss the attention in 18
  # of the 24 layers entirely, so the linear_attn projections are added here.
  # AutoModelForCausalLM drops the checkpoint's vision tower and MTP head, so
  # these plain suffixes cannot leak adapters into them.
  target_modules:
    - in_proj_qkv     # linear-attn fused Q/K/V   (18 layers)
    - in_proj_z       # linear-attn gate          (18 layers)
    - out_proj        # linear-attn output        (18 layers)
    - q_proj          # standard attention        (6 layers)
    - k_proj
    - v_proj
    - o_proj
    - gate_proj       # MLP                       (24 layers)
    - up_proj
    - down_proj

training:
  learning_rate: 2.0e-4        # lower than the 135M run; larger model, longer answers

benchmark_prompts:
  - What is the difference between a Roth IRA and a traditional IRA?
  - How does compound interest work? Explain briefly.
  - What does it mean when a stock is described as having a high P/E ratio?
