# ---------------------------------------------------------------------------
# Default profile - SmolLM2 360M -> 135M, runs anywhere (Windows / Linux / Mac).
#
#   kd pipeline --config configs/default.yaml
#   ./distill.sh --config configs/default.yaml
#
# This profile is deliberately almost empty. Everything it would say is already
# the default in _base.yaml, so listing it again would create two places to
# change one value. What you see below is the complete set of differences.
#
# To retarget a run without editing any file:
#   --set models.teacher=HuggingFaceTB/SmolLM2-1.7B-Instruct
#   --set training.max_steps=600
# ---------------------------------------------------------------------------
extends: _base.yaml

project:
  name: smollm2-distillation
