# ===========================================================================
#  The 14B profile, trimmed to what a TRAINING session actually installs.
#
#  Identical to enlibraQ3-14B.yaml in every way that touches the model: same
#  teacher, same student, same corpus, same hyper-parameters. The only changes
#  are the two switches scripts/runpod.sh reads to decide which optional
#  dependency groups to install:
#
#      evaluation.engine     vllm -> hf
#      quantization.enabled  true -> false
#
#  Neither is used by a training run. evaluation.after_training is already
#  false in the parent, so nothing scores anything here; and quantization runs
#  as a stage AFTER training, which is a thing `kd quantize` does on its own
#  later, against the adapter this run produces.
#
#  What it buys: scripts/runpod.sh installs `remote` alone - about ninety
#  seconds - instead of resolving and downloading vLLM and llm-compressor,
#  which pin their own torch and turn pod startup into fifteen or twenty
#  minutes of an 80 GB card sitting idle at its hourly rate.
#
#  USE IT FOR THE TRAINING SESSION ONLY:
#
#      ./run.sh --config configs/enlibra/enlibraQ3-14B-train.yaml --skip upload
#      ./run.sh --config configs/enlibra/enlibraQ3-14B-train.yaml upload <run-id>
#
#  Then pack and score with the FULL profile, which is where vLLM and
#  llm-compressor are genuinely needed and worth their install:
#
#      ./run.sh --config configs/enlibra/enlibraQ3-14B.yaml \
#          quantize --adapter /workspace/runs/<run-id>/final_adapter
#      ./run.sh --config configs/enlibra/enlibraQ3-14B.yaml eval --skip upload \
#          --adapter /workspace/runs/<run-id>/final_adapter
# ===========================================================================
extends: enlibraQ3-14B.yaml

evaluation:
  # Only read here by runpod.sh's extras check - nothing in a training run
  # evaluates anything. The real scoring uses the parent profile and vLLM.
  engine: hf

quantization:
  # The stage is CONDITIONAL on this (pipeline.py:979), so it is skipped rather
  # than failed. Pack the adapter afterwards with `kd quantize`.
  enabled: false
