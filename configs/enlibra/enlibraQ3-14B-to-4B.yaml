# ===========================================================================
#  enLibra neuroscience curriculum - Qwen3-14B (SFT LoRA) -> Qwen3-4B
#
#  The same run as enlibraQ3-14B.yaml with a HALF-SIZE STUDENT, and nothing
#  else changed: same teacher, same corpus, same LoRA shape, same 350 steps,
#  same held-out set, same arena. That is the point - the two bundles are
#  directly comparable on the same 142 questions, so the difference between
#  them is the student and only the student.
#
#  TWO SCRIPTS, NO HAND-INSTALLING. Pod A, an 80 GB card, trains:
#
#      ./run.sh --config configs/enlibra/enlibraQ3-14B-to-4B.yaml --skip upload
#      # ... re-export fresh AWS credentials ...
#      ./run.sh --config configs/enlibra/enlibraQ3-14B-to-4B.yaml upload <run-id>
#
#  Pod B, a 48 GB card, packs and scores - see enlibraQ3-14B-to-4B-score.yaml:
#
#      ./scripts/score-pod.sh all \
#          --config configs/enlibra/enlibraQ3-14B-to-4B-score.yaml
#
#  `--skip upload` on the training run is the 15-minute credential, not a
#  preference: the pipeline's upload stage runs LAST, hours after preflight,
#  and is guaranteed to find an expired token. Every upload is its own command
#  with freshly exported credentials. See docs/RUNBOOK-14B.md.
#
#  What makes ./run.sh enough here, where the 8B profile needs the runbook's
#  hand-rolled installs, is `quantization.enabled: false` at the bottom of this
#  file. The reason is written out there.
#
#  WHY 4B AT ALL
#  -------------
#  14B -> 8B is a 1.85x compression; this is 3.7x. That is still an ordinary
#  ratio for a NARROW student - one curriculum, one fixed
#  <Explanation>/<Answer> shape - and it roughly halves what the deployed
#  artifact costs to serve: ~2.5 GB packed to W4A16 against ~5.7 GB for the 8B.
#
#  WHERE IT IS EXPECTED TO COST SOMETHING, so that a drop there is read as what
#  it is rather than as a broken run: the held-out set runs to 5 hops where
#  training tops out at 3, and 80 of the 142 rows are 4- or 5-hop. Depth of
#  reasoning chain is the capability most sensitive to parameter count, so the
#  gap against the 8B student should concentrate in those rows and be small or
#  absent on the 1- and 2-hop ones. Read the report by hop depth, not by the
#  headline accuracy.
#
#  BEFORE SPENDING A GPU-HOUR ON THIS, score the stock student on the same
#  file - no training, no teacher, one player:
#
#      python3 -m kd arena --config configs/enlibra/enlibraQ3-14B-to-4B.yaml \
#          --skip distilled --skip distilled-w4a16 \
#          --skip teacher --skip teacher-base
#
#  `--skip distilled` is what keeps it cheap: with that player out, kd.arena
#  never goes looking for an adapter (arena.py:1253), so the only weights that
#  load are stock Qwen3-4B.
#
#  That is the headroom. If stock Qwen3-4B is already near stock Qwen3-8B on
#  these rows, this run is worth making; if it collapses on the 4- and 5-hop
#  rows, 1384 training rows will not rescue it, and the answer is a bigger
#  student or a bigger corpus rather than a longer run.
# ===========================================================================
extends: enlibraQ3-14B.yaml

project:
  # Leads the run id, so this profile's bundles sit beside the 8B ones under
  # the same s3.prefix without ever colliding with them.
  name: enlibra-neuroscience-q3-14b-to-4b

models:
  # THE ONE LINE THIS PROFILE EXISTS TO CHANGE. Everything above and below is
  # either inherited or a consequence of it.
  #
  # Verified against the Hub while writing this file: Qwen3-4B and Qwen3-8B
  # both declare vocab_size 151936 and 36 layers, and share the Qwen3
  # tokenizer and chat template - so the shared-vocabulary requirement that
  # standard GKD depends on holds exactly as it does for the 8B student. The
  # loss is a divergence between two distributions over the same index set,
  # and a mismatch there is silently meaningless rather than an error.
  #
  # Qwen3-4B ties its input and output embeddings (tie_word_embeddings: true)
  # where Qwen3-8B does not. Nothing in training cares - LoRA touches the seven
  # projections below and never the embedding - but see `quantization` at the
  # bottom, where it changes what `ignore: [lm_head]` actually keeps.
  student: Qwen/Qwen3-4B

  # teacher, teacher_adapter, teacher_base and tokenizer are all inherited
  # unchanged. The teacher side of this run is bit-for-bit the 8B profile's,
  # which is what makes the two results comparable.

hardware:
  device: auto
  # 14.8B + 4.02B parameters, both resident - the teacher frozen, the student
  # training - is 37.6 GB of weights at bfloat16 before a single activation:
  # 29.6 for the teacher, 8.0 for the student. The 8B profile's figure is 46.0,
  # so the saving is 8.4 GB of weights; the teacher dominates either way.
  #
  # Add the LoRA state - 264M trainable parameters (see `lora` below), so
  # ~0.5 GB of adapter, ~0.5 GB of gradients and ~2.1 GB of fp32 AdamW moments
  # - plus activations for a 36-layer forward at ~800 tokens with
  # gradient_checkpointing off, plus two sets of vocab-wide logits for the JSD,
  # and the working set is ~45-48 GB against the 8B profile's ~55-60.
  #
  # SO: BUDGET AN 80 GB CARD, same as the 8B profile. A 48 GB L40S is now
  # arguable rather than hopeless, but it is arguable at the very top of the
  # card, and the allocator does not politely refuse - it fails partway through
  # the first forward pass, after both models have downloaded. If a 48 GB card
  # is what you want, the headroom is bought by the commented line under
  # `training` below, and the smoke stage settles it in two steps for about a
  # dollar rather than in an argument.
  dtype: bfloat16

lora:
  # r=128 over the same seven projections, INHERITED AND DELIBERATELY UNCHANGED.
  #
  # Qwen3-4B's narrower layers make the same r a smaller adapter on their own:
  #   128 x (2560+4096) + 2 x 128 x (2560+1024) + 128 x (4096+2560)
  #     + 2 x 128 x (2560+9728) + 128 x (9728+2560)  =  7.34M per layer
  #     x 36 layers                                  =  264M trainable
  # against 349M for the 8B student.
  #
  # Raising r to compensate for the smaller base is the obvious thing to try
  # and the wrong thing to try FIRST: it would confound the one variable this
  # profile exists to isolate. Try it as a third run, once this one has a
  # number.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  # 350 steps over the same 1384 rows at an effective batch of 8 - roughly two
  # passes, identical to the 8B run. Unchanged on purpose: a different schedule
  # would make the two students incomparable.
  max_steps: 350

  # THE 48 GB CARD LIVES HERE. Recomputing each layer's activations in the
  # backward pass instead of holding them buys ~3-4 GB at this shape, for
  # roughly 30% slower steps. It is off by default and inherited off, because
  # on an 80 GB card it is a pure loss.
  #
  #     --set training.gradient_checkpointing=true
  #
  # Turn it on for an L40S or an A6000 that way rather than by editing this
  # file, so the run manifest records that the run was squeezed onto a smaller
  # card.
  # gradient_checkpointing: true

gkd:
  # lmbda: 0.0 is inherited, and it is the setting most likely to be what
  # separates this student from the 8B one.
  #
  # Off-policy KD scores the teacher's distribution over FIXED completions.
  # On-policy - the correction that makes GKD better than plain KD - scores it
  # over the student's OWN, which is where the student's own error distribution
  # gets corrected. That correction matters more as the student shrinks, and
  # this is the smallest student the neuroscience profiles have trained.
  #
  # It stays 0.0 here anyway, for the same reason max_steps does: the first 4B
  # run should differ from the 8B run in one thing. If the 4B falls short, this
  # is the first knob to reach for - and the Qwen3 chat-template problem
  # documented in enlibraQ3-14B.yaml has to be solved before it can be.
  lmbda: 0.0

limits:
  # Lower than the 8B profile's 40.00 because the run is cheaper, not because
  # it is safer: still inert unless KD_PRICE_PER_HOUR is exported, and still a
  # hard stop that leaves only the last save_steps checkpoint when it fires.
  max_cost_usd: 30.00
  confirm_above_usd: 10.00

runpod:
  # Only read by `kd runpod launch`. The by-hand path that RUNBOOK-14B.md
  # describes ignores this block and takes its ceiling from KD_PRICE_PER_HOUR.
  #
  # Still an 80 GB card - see the arithmetic under `hardware`. To rent a 48 GB
  # card instead, change this to `L40S` AND pass
  # --set training.gradient_checkpointing=true.
  enabled: true
  gpu_type: H100 80GB PCIe
  max_price_per_hour: 3.50
  spot: false
  # Qwen3-14B (~30 GB) and Qwen3-4B (~8 GB) both land in HF_HOME on the volume,
  # alongside the teacher adapter, the bundle and its checkpoints. 160 where
  # the 8B profile needs 200 - but the SCORING pod still wants 200, because the
  # arena materialises the teacher as a dense 29.5 GB checkpoint for vLLM.
  volume_gb: 160
  container_disk_gb: 40

quantization:
  # OFF HERE, ON IN THE SCORE PROFILE - and this is what lets ./run.sh drive
  # the training run with no hand-installing at all.
  #
  # scripts/runpod.sh reads this key (runpod.sh:228) and, when it is true, adds
  # the `quantize` optional group to the SINGLE pip call it builds
  # (runpod.sh:296). That call also carries `transformers>=5.16.1` from
  # [project.dependencies], and llm-compressor caps transformers at <=5.14.1,
  # so the resolve has no solution. ./run.sh runs setup before EVERY command,
  # so that failure would stop `check` and `doctor` as surely as the pipeline -
  # which is the whole reason RUNBOOK-14B.md installs by hand for the 8B
  # profile.
  #
  # Nothing is lost: the packing belongs on the scoring pod regardless, where
  # scripts/score-pod.sh does the ordered install itself (score-pod.sh:265 -
  # llm-compressor with transformers deliberately unpinned, vLLM afterwards)
  # and enlibraQ3-14B-to-4B-score.yaml turns this back on. The 80 GB card then
  # does nothing but train, which is the two-pod split the runbook recommends.
  #
  # The settings below are still read from here - the score profile inherits
  # every one of them and flips only `enabled`, so the packing is described in
  # one place.
  enabled: false
  scheme: W4A16
  # Unchanged, and still correct for this student - worth stating rather than
  # assuming, because group_size has to DIVIDE the layer widths it groups.
  # Qwen3-4B's hidden 2560 (= 20 groups) and FFN 9728 (= 76 groups) both take
  # 128, as Qwen3-8B's 4096 and 12288 did.
  group_size: 128
  # On Qwen3-8B this kept a standalone 151936 x 4096 output projection at full
  # width. Qwen3-4B TIES its embeddings, so the matrix this protects is the
  # shared 151936 x 2560 embedding - 0.78 GB at bf16 rather than 1.2 GiB. Same
  # reasoning, smaller bill: it is the one matrix whose rounding error lands
  # straight on the logits, with no later layer to absorb it.
  #
  # It is also a larger SHARE of a 4B model than of an 8B one, so expect the
  # packed checkpoint to come out nearer 2.4x smaller than the 2.7x the 8B saw
  # - roughly 2.5 GB.
  ignore: [lm_head]
  calibration_samples: 128
  max_seq_length: 2048
  # The rows the student trained on, so GPTQ tunes its rounding for the
  # distribution this model will actually be asked to produce.
  calibration_file: ./data/enlibra-neuroscience/sft-1to3hop.jsonl
