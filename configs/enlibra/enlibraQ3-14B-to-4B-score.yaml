# ===========================================================================
#  Score a 14B -> 4B adapter that is ALREADY IN THE BUCKET.
#
#  The 4B counterpart of enlibraQ3-14B-score.yaml, and the same shape: the
#  training pod is gone, what survives is the bundle it uploaded, and this
#  profile fetches the LoRA, packs it to W4A16, scores five players against
#  the held-out set and ships the results back beside the adapter they
#  describe - on a pod that never trains anything.
#
#  It changes nothing about the models or the measurement. Everything below is
#  a PATH: which adapter, where downloads land, where the packed copy goes.
#
#  FIRST, POINT IT AT THE RUN YOU TRAINED. The run id appears TWICE below -
#  in evaluation.adapter and in quantization.output_dir - and both must move
#  together, or the packing succeeds and the arena reports
#  `distilled-w4a16 skipped: no packed checkpoint` hours later:
#
#      sed -i 's/RUN-ID-FROM-THE-TRAINING-BANNER/<run-id>/g' \
#          configs/enlibra/enlibraQ3-14B-to-4B-score.yaml
#      grep -n 'RUN-ID-FROM-THE-TRAINING-BANNER' \
#          configs/enlibra/enlibraQ3-14B-to-4B-score.yaml    # must print nothing
#
#  THEN, on a 48 GB card:
#
#      ./scripts/score-pod.sh all \
#          --config configs/enlibra/enlibraQ3-14B-to-4B-score.yaml
#
#  which runs setup -> quantize -> upload -> eval -> upload, pausing before
#  each billable step, and is idempotent after a failure. The by-hand form of
#  those same steps is in docs/RUNBOOK-14B.md; re-export AWS credentials
#  immediately before each one, including `quantize` and `eval` - both reach
#  the bucket in their first seconds.
#
#  48 GB is ample here, as it is for the 8B: players load one at a time and
#  the 29.5 GB dense teacher is the ceiling, not the student.
# ===========================================================================
extends: enlibraQ3-14B-to-4B.yaml

evaluation:
  # The adapter the training pod uploaded. Named here rather than on every
  # command, so there is no chance of scoring one run and reporting another.
  # kd.paths.localise fetches it into s3.cache_dir on first use and reuses that
  # copy afterwards - preflight needs a LIVE token for those few hundred MB.
  adapter: s3://enlibra/dss/dev/runs/20260818_215840_neuroscience_8f33eb7cf609/outputs/gkd/runs/RUN-ID-FROM-THE-TRAINING-BANNER/final_adapter

  # Leads the evaluation directory name, so the bundle's evaluation/ listing
  # says what each scoring was for rather than repeating the profile name.
  name: w4a16

  # engine: vllm, arena_file, players and arena_elo_rounds are all inherited,
  # and inherited from the SAME chain the 8B score profile reads. That is what
  # makes the two reports comparable rather than merely similar.

quantization:
  # BACK ON. The training profile keeps this false so that ./run.sh can install
  # the training pod in one pip call - see the long note there. The packing
  # happens on THIS pod, where scripts/score-pod.sh installs llm-compressor
  # first with transformers unpinned, and vLLM only afterwards, for the step
  # that needs it (score-pod.sh:265). Every other packing setting - scheme,
  # group_size, ignore, calibration - is inherited unchanged from the training
  # profile, so the packed student is described in exactly one place.
  enabled: true

  # WHERE THE PACKED STUDENT LANDS, and the single most important line here.
  #
  # Without it, kd.paths.quantized_dir derives the location from the adapter -
  # which is in the cache, because it was fetched - and the arena would look
  # there while `kd upload` shipped a bundle that never held it. Pinned into
  # the runs tree, the packed model sits beside the evaluation that scored it
  # and the `quantized` upload group (remote/s3.py:50) covers it.
  #
  # Must match the --out passed to `kd quantize`; score-pod.sh reads it from
  # here so the two cannot drift.
  output_dir: /workspace/runs/RUN-ID-FROM-THE-TRAINING-BANNER/quantized

s3:
  # ON THE VOLUME, not the container disk. This is not tidiness.
  #
  # The arena cannot hand vLLM a base plus an adapter, so it materialises the
  # teacher as a dense checkpoint (arena.py:1097) - 29.5 GB of Qwen3-14B, the
  # same as for the 8B student, because it is the TEACHER being merged. For an
  # adapter that is not in a run bundle, kd.paths.derived_dir writes that merge
  # next to the cache directory, and the default cache is under $HOME on a
  # pod's 40 GB container disk. That run dies three hours in with ENOSPC.
  #
  # Moving the cache here moves the merge with it: /workspace/merged.
  cache_dir: /workspace/kd-cache
