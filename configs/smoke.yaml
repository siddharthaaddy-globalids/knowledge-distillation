# ---------------------------------------------------------------------------
# Fast smoke profile - validates the whole pipeline end to end in a couple of
# minutes. Tiny pools, 2 steps, no real convergence. Used by CI and by anyone
# checking that a machine can run this at all before committing a real budget.
#
#   kd pipeline --config configs/smoke.yaml
#
# The teacher-check stage still runs, because a smoke test that skips the one
# check that catches a broken teacher is not testing the thing most likely to
# be wrong.
# ---------------------------------------------------------------------------
extends: _base.yaml

project:
  name: smollm2-distillation-smoke

dataset:
  validation_size: 8
  domains:
    - name: everyday-conversations
      config: everyday-conversations
      quota: 16
      pool: 60
    - name: constraints
      config: smol-constraints
      quota: 16
      pool: 60

lora:
  r: 8
  alpha: 16
  target_modules:
    - q_proj
    - v_proj

training:
  max_steps: 2
  gradient_accumulation_steps: 2
  save_steps: 2
  save_total_limit: 1
  benchmark_every: 2

gkd:
  max_new_tokens: 16

evaluation:
  samples: 8

limits:
  # A smoke run that has not finished in ten minutes has hung, not slowed down.
  max_runtime_minutes: 10

benchmark_prompts:
  - List three states of matter. Use a numbered list.
