# ---------------------------------------------------------------------------
# Fast smoke config - validates the whole pipeline end to end in a couple of minutes.
# Tiny pools, 2 steps, no real convergence. Used by CI and by --dry-run checks.
#
#   python train_scaled.py --config configs/smoke.yaml --dry-run
# ---------------------------------------------------------------------------

project:
  name: smollm2-distillation-smoke
  output_dir: ./distilled_smollm_smoke
  seed: 42

models:
  student: HuggingFaceTB/SmolLM2-135M-Instruct
  teacher: HuggingFaceTB/SmolLM2-360M-Instruct
  tokenizer: teacher

hardware:
  device: auto
  dtype: auto
  threads: 0

dataset:
  source: HuggingFaceTB/smoltalk
  max_prompt_tokens: 128
  max_total_tokens: 384
  validation_size: 8
  include_synthetic: true
  domains:
    - name: everyday-conversations
      config: everyday-conversations
      quota: 16
      pool: 60
    - name: constraints
      config: smol-constraints
      quota: 16
      pool: 60

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  max_steps: 2
  batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  warmup: 0.05
  max_grad_norm: 1.0
  logging_steps: 1
  save_steps: 2
  save_total_limit: 1
  eval_enabled: true
  benchmark_every: 2

gkd:
  lmbda: 0.5
  beta: 0.5
  temperature: 0.7
  max_new_tokens: 16
  seq_kd: false

benchmark_prompts:
  - List three states of matter. Use a numbered list.
