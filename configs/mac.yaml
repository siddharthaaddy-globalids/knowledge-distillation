# ---------------------------------------------------------------------------
# Apple Silicon (M-series) profile - MPS backend over unified memory.
#
#   kd pipeline --config configs/mac.yaml
#
# Unified memory means the GPU addresses the same physical RAM as the CPU, so
# there is no host->device copy and no separate VRAM ceiling. The practical
# consequences:
#
#   * A far larger teacher fits than on a discrete GPU of nominal equivalent
#     size. On a 32 GB+ Mac a 1.7B teacher against a 360M student is comfortable.
#   * Larger batches are cheap in transfer terms - raise batch_size before
#     reaching for gradient accumulation, since accumulation costs wall clock
#     and batching does not. That is the main change this profile makes.
#   * hardware.mps_high_watermark_ratio is 0.0 in _base.yaml already, which lifts
#     the allocator's default working-set ceiling and lets a large graph use the
#     whole pool.
#
# dtype note: transformers only permits bfloat16 on MPS from macOS 14.0 onward,
# and on M1/M2 Metal emulates it over fp32 rather than running it natively - so
# it saves memory but will not necessarily be faster. `auto` selects float32,
# which is the safe choice. On macOS 14+ ask for the headroom explicitly:
#
#   kd pipeline --config configs/mac.yaml --set hardware.dtype=bfloat16
# ---------------------------------------------------------------------------
extends: _base.yaml

project:
  name: smollm2-distillation-mac

hardware:
  device: mps

training:
  # Unified memory makes real batching cheap - prefer this over accumulation.
  batch_size: 4
  gradient_accumulation_steps: 1
