# ---------------------------------------------------------------------------
# Apple Silicon (M-series) config - MPS backend over unified memory.
#
#   python train_scaled.py --config configs/mac.yaml
#
# Unified memory means the GPU addresses the same physical RAM as the CPU, so there
# is no host->device copy and no separate VRAM ceiling. The practical consequences:
#
#   * A far larger teacher fits than on a discrete GPU of nominal equivalent size.
#     On a 32 GB+ Mac a 1.7B teacher against a 360M student is comfortable.
#   * Larger batches are cheap in transfer terms - raise batch_size before reaching
#     for gradient accumulation, since accumulation costs wall clock and batching
#     does not.
#   * Set hardware.mps_high_watermark_ratio to 0.0 (below) to lift the allocator's
#     default working-set ceiling and let a large graph use the whole pool.
#
# dtype note: transformers only permits bfloat16 on MPS from macOS 14.0 onward, and
# on M1/M2 Metal emulates it over fp32 rather than running it natively - so it saves
# memory but will not necessarily be faster. `auto` selects float32, which is the
# safe choice. Set dtype: bfloat16 explicitly on macOS 14+ if you need the headroom
# for a bigger teacher.
# ---------------------------------------------------------------------------

project:
  name: smollm2-distillation-mac
  output_dir: ./distilled_smollm_mac
  seed: 42

models:
  student: HuggingFaceTB/SmolLM2-135M-Instruct
  teacher: HuggingFaceTB/SmolLM2-360M-Instruct
  tokenizer: teacher

hardware:
  device: mps
  dtype: auto                     # set to bfloat16 on macOS 14+ for a larger teacher
  mps_fallback: true              # route MPS-unsupported ops to CPU instead of raising
  mps_high_watermark_ratio: 0.0   # 0.0 = no allocator ceiling; use the full pool

dataset:
  source: HuggingFaceTB/smoltalk
  max_prompt_tokens: 128
  max_total_tokens: 384
  validation_size: 50
  include_synthetic: true
  domains:
    - name: everyday-conversations
      config: everyday-conversations
      quota: 320
      pool: 1800
    - name: summarization
      config: smol-summarize
      quota: 240
      pool: 14000
    - name: rewriting
      config: smol-rewrite
      quota: 240
      pool: 2500
    - name: constraints
      config: smol-constraints
      quota: 320
      pool: 900
    - name: factual-qa
      config: openhermes-100k
      quota: 380
      pool: 1500

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_steps: 300
  # Unified memory makes real batching cheap - prefer this over accumulation on Mac.
  batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  warmup: 0.05
  max_grad_norm: 1.0
  logging_steps: 1
  save_steps: 100
  save_total_limit: 2
  eval_enabled: true
  benchmark_every: 100

gkd:
  lmbda: 0.5
  beta: 0.5
  temperature: 0.7
  max_new_tokens: 40
  seq_kd: false

benchmark_prompts:
  - List three states of matter. Use a numbered list.
  - "Solve for x: 3x + 12 = 27."
  - Explain why the sky looks blue to human eyes in two sentences.
