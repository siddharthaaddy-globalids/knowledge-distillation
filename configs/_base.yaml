# ===========================================================================
#  Base configuration - the single source of truth for every default.
#
#  Nothing in src/kd/ carries a training value: if a setting has a default, it
#  is on this page. Every other profile begins with
#
#      extends: _base.yaml
#
#  and lists only what it changes. That makes the YAML you point at the whole
#  truth about a run, and lets --set reach any key below by dotted path:
#
#      kd pipeline --config configs/qwen/finance.yaml --set training.max_steps=500
#
#  Profiles are grouped by what they distil:
#      configs/enlibra/   the enLibra space curriculum (Qwen2.5 and Qwen3 pairs)
#      configs/smollm/    SmolLM2 - the starter pair that runs anywhere
#      configs/qwen/      stock Qwen3.5 pairs, finance
#  One profile describes both halves of a pair's life: `kd pipeline` trains
#  from it, `kd eval` scores from its `evaluation:` section.
#
#  Precedence, lowest to highest:
#      _base.yaml  <  profile  <  KD_* env vars  <  --set  <  explicit flag
#
#  Unknown keys are a hard error, not a silent no-op, so a typo like
#  "traning:" fails immediately with a suggestion instead of quietly doing
#  nothing for the whole run.
# ===========================================================================

project:
  name: smollm2-distillation
  seed: 42
  # Parent directory for run bundles. Each run creates
  #   <runs_dir>/<utc-timestamp>-<profile>-<git-sha7>/
  # holding the resolved config, logs, metrics, report and the adapter.
  runs_dir: ./runs
  # Pin the run directory instead of generating a name. Normally null; set by
  # --output DIR when a fixed, predictable path is wanted.
  output_dir: null

models:
  # Swap these two lines to retarget the whole run.
  # Student and teacher MUST share a tokenizer vocabulary for standard GKD.
  student: HuggingFaceTB/SmolLM2-135M-Instruct
  # The teacher, in any of three forms:
  #   * a merged checkpoint - a Hub id, a directory, or an s3:// prefix;
  #   * a base model here plus a LoRA adapter in teacher_adapter below;
  #   * a LoRA adapter ALONE - a directory, s3:// prefix or Hub repo holding
  #     adapter_config.json. Preflight notices, reads the base the adapter
  #     records, and rewrites this into the base + adapter form before
  #     anything loads. Nothing else needs to change.
  # The base + adapter forms are the safer ones: merged exports written by
  # other frameworks often keep that framework's key layout, which plain
  # transformers may not map back onto the architecture, and the teacher-check
  # stage exists to catch exactly that.
  teacher: HuggingFaceTB/SmolLM2-360M-Instruct
  # A LoRA adapter merged into the teacher at load time. See above.
  teacher_adapter: null
  # The stock model the teacher was fine-tuned FROM. The evaluation scores it
  # as a fourth player, `teacher-base`: how far the fine-tune moved the teacher
  # is the most there was to distil, and a student no closer to the teacher
  # than the stock model was has learned nothing new. Filled in automatically
  # when the teacher is base + adapter (it is the base). A merged checkpoint
  # cannot say what it was built from, so name it here - or leave null and the
  # player is skipped with a note.
  teacher_base: null
  # Tokenizer source: "teacher", "student", or an explicit path / hub id.
  tokenizer: teacher

hardware:
  device: auto        # auto | cpu | mps | cuda
  dtype: auto         # auto | float32 | bfloat16 | float16
  threads: 0          # CPU thread count; 0 = all cores. Ignored off CPU.
  # Apple Silicon: let the MPS allocator use the whole unified memory pool
  # instead of hard-failing at the default working-set ceiling.
  mps_high_watermark_ratio: 0.0
  # Route MPS-unsupported ops to CPU rather than raising.
  mps_fallback: true

dataset:
  source: HuggingFaceTB/smoltalk
  max_prompt_tokens: 128
  max_total_tokens: 384
  validation_size: 50
  include_synthetic: true
  # quota is how many samples to keep; pool is how many rows to scan to find
  # them. Long-document domains need a large pool because the prompt-length
  # filter is strict: only ~2% of smol-summarize prompts fit under 128 tokens.
  domains:
    - name: everyday-conversations
      config: everyday-conversations
      quota: 320
      pool: 1800
    - name: summarization
      config: smol-summarize
      quota: 240
      pool: 14000
    - name: rewriting
      config: smol-rewrite
      quota: 240
      pool: 2500
    - name: constraints
      config: smol-constraints
      quota: 320
      pool: 900
    - name: factual-qa
      config: openhermes-100k
      quota: 380
      pool: 1500

lora:
  # Rank 128 with alpha at twice the rank: the one LoRA-specific on-policy
  # distillation recipe (Thinking Machines, 2025) used 128 and found LoRA then
  # trails full fine-tuning by only 6%. Halve both if a profile runs out of
  # memory; 32 was on the small side. See docs/papers/README.md.
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_steps: 300
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  # Float in [0,1) is a ratio of total steps; an int >= 1 is an exact step count.
  # transformers 5.x removed warmup_ratio in favour of this dual-typed field.
  warmup: 0.05
  max_grad_norm: 1.0
  logging_steps: 1
  # How often a resumable checkpoint is written. This matters for cost control:
  # when a run is stopped by a limit, the last checkpoint is what survives.
  save_steps: 100
  save_total_limit: 2
  eval_enabled: true
  benchmark_every: 100
  # Recompute activations in the backward pass instead of keeping them.
  #
  # The lever to reach for when a run dies with CUDA out of memory and the
  # allocator is not merely fragmented. It trades roughly 30% of throughput for
  # a large cut in activation memory, and changes nothing about the result - the
  # gradients are identical, they are just derived twice.
  #
  # Off by default: most runs fit without it, and paying 30% for headroom you do
  # not need is a bad trade on a rented GPU.
  gradient_checkpointing: false
  # How many tokens the periodic sample generations are allowed.
  #
  # A ceiling, not a length. A trained student emits end-of-turn around 350
  # tokens and stops there, so this never binds; it exists only because
  # generate() needs some stop condition, and an untrained student has no other
  # one - without it an early probe would run to the model's full 32k context.
  #
  # 2048 is deliberately far above what a correct answer costs. The price is
  # paid only by a model that will not stop, which is itself worth seeing.
  benchmark_max_new_tokens: 2048

# The values the literature settles on for a student much smaller than its
# teacher - Agarwal et al. 2024 (GKD), Ko et al. 2024 (DistiLLM), and the 2025
# Thinking Machines recipe on Qwen3. Each is explained, with the papers'
# numbers, in docs/papers/README.md, and every report repeats the explanation
# next to the values a run actually used ("How it was trained").
gkd:
  # On-policy fraction. Every GKD ablation has 0.5 beating 0, and gains need
  # at least 0.25; DistiLLM ramps it up from 0 because a student's early
  # rollouts mislead the teacher. Raise toward 1.0 for more student rollouts.
  lmbda: 0.5
  # Generalized JSD interpolation: 0 is forward KL (cover everything the teacher
  # considers possible), 1 is reverse KL (commit to the teacher's modes). 0.9
  # is the reverse-leaning value GKD recommends when the student should stay
  # close to a reference, and the closest TRL offers to DistiLLM's skew KL.
  beta: 0.9
  # Cross-entropy weight. The loss is (1 - ce_alpha) * JSD_beta + ce_alpha * CE,
  # where CE is the ordinary SFT term, -log p_student(gold token). 0 is the
  # pure divergence the GKD/DistiLLM papers train with; 1 is plain SFT with
  # the teacher ignored. The CE only applies where the labels are gold - the
  # curriculum's completions, or the teacher's under seq_kd - never to a
  # student rollout, which would only reinforce whatever it already wrote.
  # 0.2 keeps the teacher's distribution as the main signal and uses the
  # gold tokens as an anchor, so a teacher that is soft or wrong on a row
  # cannot pull the student off the curriculum's answer.
  ce_alpha: 0.2
  # Sampling temperature for the student's own completions. 1.0 is the model's
  # own distribution, which is what every on-policy recipe trains at: lower
  # values only visit the student's confident paths, the ones least in need of
  # correction. Inert while lmbda is 0.
  temperature: 1.0
  max_new_tokens: 40
  # true has the teacher rewrite each completion before the student trains on
  # it. Never beats on-policy data in the literature, and costs a teacher
  # generation per sample.
  seq_kd: false

# ---------------------------------------------------------------------------
#  Evaluation. Separate from training: an adapter is trained once and scored
#  as many times as there are questions to ask of it, on whatever machine is
#  to hand. `kd eval` walks the `stages` below against an adapter and writes
#  everything into a directory of its own INSIDE the adapter's bundle -
#
#      runs/<train-run>/evaluation/<name>-<YYYY-MM-DD>-<HHMM>/
#
#  and to the same path beside the adapter in the bucket. A second scoring
#  makes a second directory; nothing is ever overwritten.
# ---------------------------------------------------------------------------
evaluation:
  # What `kd eval` scores: an adapter directory, a file inside one, or an
  # s3:// URI. null means --adapter on the command line, else the newest
  # adapter under project.runs_dir.
  adapter: null
  # What this evaluation is FOR - `full`, `quick`, `after-parser-fix`. It
  # leads the directory name, so a bundle's evaluation/ listing says why each
  # scoring was done. null uses the profile name.
  name: null
  # true scores the adapter INSIDE the training run, as its `evaluation` stage,
  # right after training - the teacher is resident and already paid for on a
  # pod. Off by default: training ends with the adapter in the bucket, and the
  # scoring happens when and where it is wanted. The output layout is the same
  # either way.
  after_training: false
  # Who is scored. Four models, each answering a question the others cannot:
  #   base          the stock student, no adapter - the control
  #   distilled     the student plus the trained adapter - the result
  #   teacher-base  the stock model the teacher was fine-tuned from - what
  #                 the fine-tune bought the TEACHER; skipped when unknown
  #   teacher       the fine-tuned teacher - the ceiling, and the reference
  #                 every closeness figure is measured against
  # Drop `teacher` and `teacher-base` to score base against distilled without
  # loading eight gigabytes of weights.
  players: [base, distilled, teacher-base, teacher]
  # The stages `kd eval` walks, in order. A gate that fails stops the
  # evaluation; a non-gate failure is reported and the rest still runs. The
  # arena runs only when arena_file names a held-out set; upload only when
  # s3.enabled. --only / --from / --skip narrow a single run.
  stages:
    - {name: preflight, gate: true}    # fetch the teacher and the adapter; say what is scored
    - {name: evaluate,  gate: false}   # fidelity and perplexity against the teacher
    - {name: arena,     gate: false}   # accuracy and Elo on the answer key
    - {name: report,    gate: false}   # report.html in the evaluation directory
    - {name: upload,    gate: false}   # to <bundle>/evaluation/<id>/ in the bucket
  samples: 50           # held-out samples scored for fidelity and perplexity
  tasks: null           # lm-eval task list, e.g. "ifeval,arc_easy"; null = skip
  limit: null           # per-task example cap for a quick look
  gen_similarity: 0     # free-running BERTScore prompts; 0 = skip (slow: 3 models generate)
  similarity_model: roberta-large
  report_format: html   # html | md - written into the run bundle as report.<ext>
  # The report's "How it was trained" section: the gkd knobs, what each does,
  # and what each meant at the value this run used. Off hides the section.
  report_training: true
  # --- the arena -----------------------------------------------------------
  # A held-out multiple-choice file - one {"messages": [...]} per line, the
  # assistant turn ending in an <Answer> tag - scored for accuracy, and turned
  # into an Elo rating by playing the base student, the distilled student and
  # the teacher against each other question by question.
  #
  # null skips the stage entirely, which is the right default: most profiles
  # train on data that has no single correct answer to score against.
  arena_file: null
  # The answer sits after the explanation, so a small ceiling scores as "never
  # answered" rather than as wrong. Same 2048 floor as the diagnostic ceilings:
  # high enough never to bind on a model that stops properly.
  arena_max_new_tokens: 2048
  # Sequential Elo depends on the order matches are played. Averaging over this
  # many seeded shuffles removes that dependence; 0 plays one fixed order.
  arena_elo_rounds: 25
  # Score only the first N questions. null scores the whole file, which is what
  # a real run wants. A small number is for proving the stage runs at all
  # without waiting for three models to answer everything.
  arena_limit: null
  # How much of the teacher's answer the teacher-check stage prints. Not a
  # quality setting - the check reads the first token's distribution, not the
  # text - but the text is what a person actually looks at, and an answer cut
  # off mid-sentence tells them nothing. Same reasoning as the benchmark
  # ceiling above: high enough never to bind on a model that stops properly.
  teacher_check_max_new_tokens: 2048

benchmark_prompts:
  - List three states of matter. Use a numbered list.
  - "Solve for x: 3x + 12 = 27."
  - Explain why the sky looks blue to human eyes in two sentences.

# ---------------------------------------------------------------------------
#  Pipeline. `kd pipeline` walks these stages in order and stops at the first
#  failed gate. Narrow a single run with --only / --from / --skip rather than
#  editing this list; removing a stage here changes every run of the profile.
#
#  A gate stage that fails aborts the pipeline. A non-gate stage that fails is
#  reported and the run continues, so a broken report never destroys a good
#  adapter.
#
#  Training ends with the adapter in the bucket. Scoring it is a separate
#  pipeline (`kd eval`, evaluation.stages above) unless evaluation.after_training
#  is true, which runs it here as the `evaluation` stage.
# ---------------------------------------------------------------------------
pipeline:
  stages:
    - {name: preflight,     gate: true}   # resolve config + hardware, fetch remote inputs
    - {name: teacher-check, gate: true}   # teacher only: missing weights, NaN scan, coherence
    - {name: smoke,         gate: true}   # 2 real steps; measures s/step and projects the run
    - {name: train,         gate: true}
    - {name: evaluation,    gate: false}  # skipped unless evaluation.after_training
    - {name: publish,       gate: false}  # skipped unless publish.enabled
    - {name: upload,        gate: false}  # skipped unless s3.enabled; also runs after a failure

# ---------------------------------------------------------------------------
#  Limits. Ceilings a run may never cross. Checked before the run starts - a run
#  that cannot finish inside them is refused rather than killed at 73% - and
#  again while it is in flight.
#
#  On breach the run stops hard and, on a rented pod, the pod is terminated
#  immediately. The artifact you keep is therefore the last checkpoint written
#  by training.save_steps, so tighten save_steps when caps are tight.
# ---------------------------------------------------------------------------
limits:
  # NO TIME LIMIT by default. A wall-clock ceiling does not pause a run, it
  # KILLS it - mid-epoch, keeping only whatever the last training.save_steps
  # checkpoint holds - and a training run that is merely slower than guessed is
  # not a training run that has gone wrong. Guessing that ceiling in a config
  # file, before anyone has measured a step, is how a good run gets destroyed at
  # 80%.
  #
  # Set one deliberately, per run, when you actually want the guard:
  #     --set limits.max_runtime_minutes=180
  # With one set, the smoke stage also refuses up front any run its measured
  # s/step says cannot finish inside it - which is the useful half, since
  # nothing is spent.
  max_runtime_minutes: null
  max_steps: null           # hard ceiling above training.max_steps; null = no extra ceiling
  max_cost_usd: null        # only meaningful for a rented pod; null = no cost cap
  confirm_above_usd: 1.00   # print the estimate and ask before renting above this

# ---------------------------------------------------------------------------
#  Publishing to the Hugging Face Hub. Off by default; needs `hf auth login`
#  or HF_TOKEN in the environment.
# ---------------------------------------------------------------------------
publish:
  enabled: false
  repo: null                # publishes <repo>-lora (adapter) and <repo> (merged)
  private: true
  token_env: HF_TOKEN

# ---------------------------------------------------------------------------
#  Object storage. Entirely optional. When enabled, any path in this file may
#  be an s3:// URI - teacher, teacher_adapter, student, dataset.source - and is
#  fetched into a local cache before use; the finished run bundle is synced up.
#  Credentials come from the environment (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#  AWS_PROFILE), never from this file.
# ---------------------------------------------------------------------------
s3:
  enabled: false
  bucket: null
  prefix: kd
  endpoint_url: null        # set for MinIO or RunPod S3-compatible volumes
  region: null
  cache_dir: ~/.cache/kd/s3
  # Which parts of the run bundle to ship. manifest.json and config.resolved.yaml
  # always go, whatever is listed here, because without them the uploaded bundle
  # cannot say what produced it.
  #   adapter  logs  report  metrics  evaluation  checkpoints
  # evaluation is every scoring of the adapter that happened inside the run
  # (evaluation.after_training). A scoring done later with `kd eval` uploads
  # its own directory to the same place in the bucket, so the bundle there
  # always holds every evaluation whichever machine produced it.
  # checkpoints is off by default: it is optimizer state, hundreds of megabytes,
  # that only a resumed run reads. A run stopped by a limit adds it automatically,
  # since the checkpoint is then the only artifact that exists.
  upload: [adapter, logs, report, metrics, evaluation]

# ---------------------------------------------------------------------------
#  RunPod. Entirely optional - nothing in the local pipeline imports it, and a
#  machine with no RUNPOD_API_KEY runs every stage above without it.
#
#  The launcher rents the GPU named here and no other. If it is unavailable it
#  stops before renting anything, lists what is available under the price cap,
#  and waits for you to choose. It never substitutes a GPU on your behalf.
# ---------------------------------------------------------------------------
runpod:
  enabled: false
  gpu_type: RTX A4000
  gpu_count: 1
  cloud_type: COMMUNITY     # COMMUNITY | SECURE
  spot: true                # interruptible, roughly half price
  max_price_per_hour: 0.60  # never rent above this, whatever is available
  image: null               # ghcr.io/<org>/kd:<sha>; null = resolved from the build
  volume_gb: 40
  container_disk_gb: 20
  terminate_on_exit: true
  api_key_env: RUNPOD_API_KEY
  # Extra variables handed to the pod. HF_TOKEN and the AWS_* credentials are
  # forwarded automatically when they are set locally, so this is for anything
  # else the run needs. Put names and values a repository may hold - never a
  # secret, which belongs in the environment this command runs in.
  extra_env: null
