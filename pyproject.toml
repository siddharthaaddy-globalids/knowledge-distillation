[project]
name = "knowledge-distillation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "gradio>=6.26.0",
    "peft>=0.20.0",
    "pyyaml>=6.0.3",
    "torch>=2.4.0",
    "transformers>=5.16.1",
    "trl>=1.12.0",
]

# Optional: the standard task-benchmark harness, pulled in only for
# `./distill.sh --evaluate --tasks ...` (uv sync --extra eval). It is a large
# dependency tree and is not needed for the fidelity/perplexity metrics, which
# evaluate.py computes with what is already installed.
[project.optional-dependencies]
eval = [
    "lm-eval[ifeval]>=0.4.5",
    # Free-running generation similarity (--gen-similarity). bert-score compares
    # contextual embeddings rather than surface strings, so a correct answer worded
    # differently is not scored as wrong - which exact-match and n-gram metrics do.
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
]

# Pull CPU-only torch wheels on Linux and Windows. Without this, Linux resolves the
# default PyPI build, which bundles the CUDA runtime and is several GB - pointless for
# CPU training and for CI. macOS is deliberately left on the default index because
# that build is the one carrying MPS (Apple Silicon GPU) support.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
