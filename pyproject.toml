[project]
name = "knowledge-distillation"
version = "0.2.0"
description = "Config-driven GKD knowledge distillation pipeline (local, Windows/macOS/Linux, optionally RunPod)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "gradio>=6.26.0",
    "peft>=0.20.0",
    "pyyaml>=6.0.3",
    "torch>=2.4.0",
    "transformers>=5.16.1",
    "trl>=1.12.0",
]

[project.optional-dependencies]
# Remote execution and object storage. Entirely optional: nothing in the core pipeline
# imports these, and a machine with no AWS or RunPod credentials runs every local stage
# without them. Installed on demand with `uv sync --extra remote`.
remote = [
    "boto3>=1.35",
    "runpod>=1.7",
]

# Batched arena generation (`evaluation.engine: vllm`). CUDA and Linux only - vLLM
# publishes no Windows wheel and no CPU-useful build, which is why the arena defaults
# to transformers and this is an extra rather than a dependency.
#
# NOT installable with a plain `uv sync --extra serve`: vLLM needs a CUDA build of
# torch, and [tool.uv.sources] below pins torch to the CPU index on Linux and Windows
# for everything else. Install it against the CUDA index explicitly -
#
#   uv pip install --index-url https://download.pytorch.org/whl/cu128 \
#                  --extra-index-url https://pypi.org/simple vllm
#
# - which is what docker/Dockerfile.cuda does, and that image is where the long
# arenas actually run.
serve = [
    "vllm>=0.8",
]

# W4A16 packing (`quantization.enabled`). CUDA-only for the same reason `serve` is,
# and installed the same way - against the CUDA torch index, which is what
# docker/Dockerfile.cuda does. `compressed-tensors` is what lets plain transformers
# read the result back, which is how the hf engine scores the packed player.
quantize = [
    "llmcompressor>=0.5",
    "compressed-tensors>=0.9",
]

[project.scripts]
kd = "kd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kd"]

# Pull CPU-only torch wheels on Linux and Windows. Without this, Linux resolves the
# default PyPI build, which bundles the CUDA runtime and is several GB - pointless for
# CPU training and for CI. macOS is deliberately left on the default index because
# that build is the one carrying MPS (Apple Silicon GPU) support. The CUDA image
# overrides this at build time (see docker/Dockerfile.cuda).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
