[project]
name = "knowledge-distillation"
version = "0.2.0"
description = "Config-driven GKD knowledge distillation pipeline (local, Windows/macOS/Linux, optionally RunPod)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "gradio>=6.26.0",
    "peft>=0.20.0",
    "pyyaml>=6.0.3",
    "torch>=2.4.0",
    "transformers>=5.16.1",
    "trl>=1.12.0",
]

[project.optional-dependencies]
# The standard task-benchmark harness, pulled in only for `--tasks` / `--gen-similarity`
# (uv sync --extra eval). A large dependency tree, and not needed for the fidelity and
# perplexity metrics, which kd.evaluate computes with what is already installed.
eval = [
    "lm-eval[ifeval]>=0.4.5",
    # Free-running generation similarity. bert-score compares contextual embeddings
    # rather than surface strings, so a correct answer worded differently is not
    # scored as wrong - which exact-match and n-gram metrics do.
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
]

# Remote execution and object storage. Entirely optional: nothing in the core pipeline
# imports these, and a machine with no AWS or RunPod credentials runs every local stage
# without them. Installed on demand with `uv sync --extra remote`.
remote = [
    "boto3>=1.35",
    "runpod>=1.7",
]

[project.scripts]
kd = "kd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kd"]

# Pull CPU-only torch wheels on Linux and Windows. Without this, Linux resolves the
# default PyPI build, which bundles the CUDA runtime and is several GB - pointless for
# CPU training and for CI. macOS is deliberately left on the default index because
# that build is the one carrying MPS (Apple Silicon GPU) support. The CUDA image
# overrides this at build time (see docker/Dockerfile.cuda).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
