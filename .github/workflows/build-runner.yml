name: Build distillation runner

# Produces `distill.sh` - a self-contained, downloadable runner artifact pinned to the
# commit it was built from. Download it, edit the teacher/student/dataset at the top,
# and run it on any machine (Apple Silicon, Linux, CUDA box).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Validate that the configs actually resolve before shipping a runner for them.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Byte-compile sources
        run: uv run python -m compileall -q train_scaled.py kd_config.py app.py test_inference.py check_teacher.py fix_teacher.py convert_mlx_adapter.py publish_model.py evaluate.py

      - name: Verify apply_config binds every name it assigns
        run: |
          uv run python - <<'PY'
          import ast
          # A name assigned in apply_config but not declared global stays a local,
          # so run() later dies with NameError - and only once it reaches that
          # line, i.e. after the dataset build and the teacher download.
          tree = ast.parse(open("train_scaled.py", encoding="utf-8").read())
          fn = next(n for n in ast.walk(tree)
                    if isinstance(n, ast.FunctionDef) and n.name == "apply_config")
          declared = {nm for n in ast.walk(fn) if isinstance(n, ast.Global) for nm in n.names}
          assigned = {t.id for n in ast.walk(fn) if isinstance(n, ast.Assign)
                      for t in n.targets if isinstance(t, ast.Name)}
          local_only = {"tokenizer_choice", "dataset_cfg"}
          leaked = assigned - declared - local_only
          assert not leaked, f"assigned but not declared global: {sorted(leaked)}"
          print(f"apply_config OK: {len(declared)} globals bound")
          PY

          # And they must actually be set on the module after a real call.
          uv run python - <<'PY'
          import importlib.util as u
          from kd_config import load_config, resolve_device
          spec = u.spec_from_file_location("ts", "train_scaled.py")
          m = u.module_from_spec(spec); spec.loader.exec_module(m)
          for cfg in ("configs/smoke.yaml", "configs/qwen-poc.yaml"):
              c = load_config(cfg)
              m.apply_config(c, resolve_device(c))
              for name in ("TEACHER_MODEL_ID", "TEACHER_ADAPTER", "STUDENT_MODEL_ID",
                           "OUTPUT_DIR", "BENCHMARK_PROMPTS"):
                  assert hasattr(m, name), f"{name} not bound after apply_config({cfg})"
          print("module globals bound OK")
          PY

      - name: Resolve every config profile
        run: |
          for cfg in configs/*.yaml; do
            echo "::group::$cfg"
            uv run python train_scaled.py --config "$cfg" --print-config
            echo "::endgroup::"
          done

      - name: Verify CLI and env overrides take effect
        run: |
          set -e
          out=$(KD_MAX_STEPS=777 uv run python train_scaled.py \
                  --config configs/default.yaml --print-config | grep -E '^ steps')
          echo "$out" | grep -q 777 || { echo "env override failed: $out"; exit 1; }

          out=$(KD_MAX_STEPS=777 uv run python train_scaled.py \
                  --config configs/default.yaml --max-steps 55 --print-config | grep -E '^ steps')
          echo "$out" | grep -q 55 || { echo "CLI precedence failed: $out"; exit 1; }

          out=$(uv run python train_scaled.py --config configs/default.yaml \
                  --teacher acme/teacher-x --print-config | grep -E '^ teacher')
          echo "$out" | grep -q 'acme/teacher-x' || { echo "teacher override failed: $out"; exit 1; }

          # Each profile must actually surface its own models, not a global default.
          out=$(uv run python train_scaled.py --config configs/finance.yaml --print-config)
          echo "$out" | grep -q 'Qwen/Qwen3.5-0.8B' || { echo "finance student wrong: $out"; exit 1; }
          echo "$out" | grep -q 'gbharti/finance-alpaca' || { echo "finance dataset wrong: $out"; exit 1; }
          # The qwen-poc profile must pair the official instruct teacher with the student.
          out=$(uv run python train_scaled.py --config configs/qwen-poc.yaml --print-config)
          echo "$out" | grep -q 'Qwen/Qwen3.5-2B' || { echo "qwen-poc teacher wrong: $out"; exit 1; }
          echo "$out" | grep -q 'Qwen/Qwen3.5-0.8B' || { echo "qwen-poc student wrong: $out"; exit 1; }
          echo "override precedence OK"

      - name: Verify the teacher checker entrypoint
        run: |
          uv run python check_teacher.py --help | grep -q -- '--teacher-adapter'
          uv run python check_teacher.py --help | grep -q -- '--dtype'
          # teacher_adapter must survive the config precedence chain
          out=$(KD_TEACHER_ADAPTER=env/A uv run python train_scaled.py                   --config configs/finance.yaml --print-config)
          echo "$out" | grep -q 'env/A' || { echo "adapter env override failed"; exit 1; }
          out=$(uv run python train_scaled.py --config configs/finance.yaml                   --teacher-adapter cli/A --print-config)
          echo "$out" | grep -q 'cli/A' || { echo "adapter CLI override failed"; exit 1; }
          echo "teacher checker OK"

      - name: Verify the checkpoint repair tool
        run: |
          uv run python fix_teacher.py --help | grep -q -- '--dry-run'
          # The key remapping must reconcile a VL-style export against a
          # text-only architecture without touching the network.
          uv run python - <<'PY'
          import importlib.util as u
          spec = u.spec_from_file_location("ft", "fix_teacher.py")
          m = u.module_from_spec(spec); spec.loader.exec_module(m)
          have, want = set(), set()
          for i in range(24):
              have.add(f"language_model.model.layers.{i}.mlp.up_proj.weight")
              want.add(f"model.layers.{i}.mlp.up_proj.weight")
              have.add(f"vision_tower.blocks.{i}.attn.qkv.weight")
          have.add("language_model.model.embed_tokens.weight")
          want.add("model.embed_tokens.weight")
          want.add("lm_head.weight")
          mapping, label = m.build_mapping(have, want)
          assert mapping, label
          mapped = set(mapping.values())
          assert mapped & want == want - {"lm_head.weight"}, sorted(want - mapped)
          assert not [k for k in mapping if k.startswith(m.DROP_PREFIXES)], "vision kept"
          print("remap OK:", label)

          # Axis-order reconciliation. The depthwise conv in linear attention is
          # exported as (channels, kernel, 1) by some frameworks and wanted as
          # (channels, 1, kernel); that swap must be recognised as lossless.
          import torch
          t = torch.arange(24, dtype=torch.float32).reshape(6, 4, 1)
          out, note = m.reconcile_shape(t, (6, 1, 4))
          assert tuple(out.shape) == (6, 1, 4), out.shape
          assert torch.equal(out.flatten(), t.flatten()), "reshape reordered elements"
          assert note.startswith("axis swap"), note
          # A real transpose must be flagged, not silently applied as lossless.
          _, note = m.reconcile_shape(torch.zeros(3, 4), (4, 3))
          assert note.startswith("TRANSPOSE"), note
          # Irreconcilable shapes must be refused.
          assert m.reconcile_shape(torch.zeros(3, 4), (5, 5))[0] is None
          assert m.reconcile_shape(torch.zeros(2, 6), (3, 4))[0] is None
          # A matching shape is a no-op.
          assert m.reconcile_shape(torch.zeros(3, 4), (3, 4))[1] is None
          print("shape reconciliation OK")
          PY
          echo "repair tool OK"

      - name: Verify the MLX adapter converter
        run: |
          uv run python convert_mlx_adapter.py --help | grep -q -- '--dry-run'
          uv run python - <<'PY'
          import importlib.util as u, torch
          spec = u.spec_from_file_location("cv", "convert_mlx_adapter.py")
          m = u.module_from_spec(spec); spec.loader.exec_module(m)
          # MLX names modules language_model.model.layers.N; the live text-only
          # tree exposes model.layers.N. The rewrite must be derived, not assumed.
          mlx = {f"language_model.model.layers.{i}.mlp.up_proj" for i in range(24)}
          live = {f"model.layers.{i}.mlp.up_proj" for i in range(24)}
          mapping, hits, label = m.choose_prefix(mlx, live)
          assert hits == 24, (hits, label)
          assert set(mapping.values()) == live, sorted(set(mapping.values()) - live)
          print("prefix rewrite OK:", label)
          # Orientation: MLX (in, r) / (r, out) -> PEFT (r, in) / (out, r).
          a = torch.zeros(2048, 16); b = torch.zeros(16, 6144)
          assert tuple(a.t().shape) == (16, 2048)
          assert tuple(b.t().shape) == (6144, 16)
          print("transpose orientation OK")
          PY
          echo "converter OK"

      - name: Verify the evaluation harness
        run: |
          uv run python evaluate.py --help | grep -q -- '--tasks'
          uv run python evaluate.py --help | grep -q -- '--samples'
          uv run python evaluate.py --help | grep -q -- '--teacher-adapter'
          uv run python evaluate.py --help | grep -q -- '--gen-similarity'
          uv run python evaluate.py --help | grep -q -- '--similarity-model'
          uv run python evaluate.py --help | grep -q -- '--report'
          # The metric maths, on tensors with known answers. These are the numbers
          # the whole mode reports, so a silent shift here would be invisible.
          uv run python - <<'PY'
          import importlib.util as u, math, torch
          spec = u.spec_from_file_location("ev", "evaluate.py")
          m = u.module_from_spec(spec); spec.loader.exec_module(m)

          # Identical logits: perfect agreement, zero divergence.
          a = torch.randn(20, 512)
          agree, kl = m.compare_distributions(a, a.clone())
          assert agree == 20, agree
          assert abs(kl) < 1e-3, kl

          # Disjoint argmaxes: zero agreement, strictly positive divergence.
          b = torch.zeros(4, 8); c = torch.zeros(4, 8)
          b[:, 0] = 10.0; c[:, 1] = 10.0
          agree, kl = m.compare_distributions(b, c)
          assert agree == 0, agree
          assert kl > 0, kl

          # Chunking must not change the result: the loop exists only to keep a
          # [positions, 248k] float32 tensor from being materialised at once.
          # Agreement is a count and must match exactly; the KL sum is compared
          # with a tolerance, since chunking changes float summation order.
          t, s_ = torch.randn(37, 256), torch.randn(37, 256)
          a4, k4 = m.compare_distributions(t, s_, chunk=4)
          a37, k37 = m.compare_distributions(t, s_, chunk=37)
          assert a4 == a37, (a4, a37)
          assert abs(k4 - k37) < 1e-3, (k4, k37)

          # NLL against a one-hot-ish distribution is ~0; perplexity ~1.
          logits = torch.full((5, 16), -20.0); logits[range(5), 3] = 20.0
          nll = m.summed_nll(logits, torch.full((5,), 3))
          assert math.exp(nll / 5) < 1.01, math.exp(nll / 5)

          # The causal shift: logits[t] predicts token t+1, so completion token
          # `prompt_len` is scored by logit index prompt_len-1. Off by one here
          # would silently score the prompt's last token instead.
          ids = torch.arange(10).unsqueeze(0)
          lg = torch.randn(1, 10, 32)
          sl, tg = m.completion_slice(lg, ids, prompt_len=4)
          assert sl.shape[0] == 6 and tg.tolist() == [4, 5, 6, 7, 8, 9], (sl.shape, tg)
          assert torch.equal(sl[0], lg[0, 3])
          # Degenerate boundaries must be refused, not scored.
          assert m.completion_slice(lg, ids, prompt_len=10)[0] is None
          assert m.completion_slice(lg, ids, prompt_len=0)[0] is None
          # The retention table must attach each metric to its own stderr and
          # flag a base->distilled difference that is inside the error bars. At
          # small --eval-limit values almost everything is noise, and a table that
          # does not say so invites exactly the wrong conclusion.
          import io, contextlib
          res = {
              "base_student":      {"arc_easy": {"acc,none": 0.20, "acc_stderr,none": 0.20,
                                                 "alias": "arc_easy", "sample_len": 5}},
              "distilled_student": {"arc_easy": {"acc,none": 0.40, "acc_stderr,none": 0.24,
                                                 "alias": "arc_easy", "sample_len": 5}},
              "teacher":           {"arc_easy": {"acc,none": 0.60, "acc_stderr,none": 0.24,
                                                 "alias": "arc_easy", "sample_len": 5}},
          }
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              m.report_tasks(res)
          out = buf.getvalue()
          assert "NOT SIGNIFICANT" in out, out
          assert "arc_easy/acc" in out, out
          # Bookkeeping keys are not metrics and must not get a retention row.
          assert "sample_len" not in out, out
          assert "alias" not in out, out
          # The stderr belongs beside its metric, not on a row of its own.
          assert "acc_stderr" not in out, out
          assert "0.2000+-0.200" in out, out

          # A difference comfortably outside the error bars must NOT be flagged.
          res["distilled_student"]["arc_easy"] = {"acc,none": 0.80, "acc_stderr,none": 0.02}
          res["base_student"]["arc_easy"] = {"acc,none": 0.20, "acc_stderr,none": 0.02}
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              m.report_tasks(res)
          assert "NOT SIGNIFICANT" not in buf.getvalue(), buf.getvalue()
          print("retention table OK")

          # Free-running similarity reporting. The scoring itself needs an encoder
          # download, so only the reporting contract is asserted here: the caution
          # for small prompt counts, and the note fired when free-running
          # similarity disagrees with the teacher-forced metrics. Both exist to stop
          # a reader drawing a conclusion the sample size does not support.
          sim = {"prompts": 4, "max_new_tokens": 64,
                 "bertscore_f1_base": 0.8968, "bertscore_f1_distilled": 0.8921,
                 "rougeL_base": 0.3406, "rougeL_distilled": 0.3371}
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              m.report_similarity(sim)
          out = buf.getvalue()
          assert "ONLY 4 PROMPTS" in out, out
          assert "did NOT improve" in out, out
          assert "BERTScore F1 vs teacher" in out and "ROUGE-L vs teacher" in out, out

          # A large, improving run must produce neither caution.
          sim = {"prompts": 100, "max_new_tokens": 64,
                 "bertscore_f1_base": 0.74, "bertscore_f1_distilled": 0.81}
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              m.report_similarity(sim)
          out = buf.getvalue()
          assert "PROMPTS - treat" not in out, out
          assert "did NOT improve" not in out, out
          # ROUGE-L absent (rouge_score missing) must not break the table. The
          # explanatory footer still names it, so assert on the ROW, not the word.
          assert "ROUGE-L vs teacher" not in out, out
          print("generation similarity reporting OK")

          # The readable report. Both formats must render from one payload, the
          # extension must pick the format, and a run WITHOUT --gen-similarity must
          # simply omit that section rather than crash.
          import json, tempfile, os
          payload = {
              "teacher": "org/T", "teacher_adapter": None, "student": "org/S",
              "adapter": "./a", "device": "cpu", "dtype": "float32",
              "samples": 50, "completion_tokens": 9000,
              "fidelity": {"top1_agreement_base_pct": 65.5,
                           "top1_agreement_distilled_pct": 71.15,
                           "agreement_lift_pts": 5.65,
                           "kl_base": 0.51, "kl_distilled": 0.36},
              "capability": {"perplexity_teacher": 14.3, "perplexity_base": 23.8,
                             "perplexity_distilled": 20.0, "gap_recovered_pct": 40.1},
              "closeness_to_teacher": {
                  "prediction_agreement_base_pct": 65.5,
                  "prediction_agreement_distilled_pct": 71.15,
                  "perplexity_retention_base_pct": 60.0,
                  "perplexity_retention_distilled_pct": 71.5},
              "efficiency": {"teacher_params": 1882000000, "student_params": 773000000,
                             "adapter_params": 20450000,
                             "teacher_tok_per_s": 17.1, "distilled_tok_per_s": 26.7},
              "generation_similarity": None,
          }
          tmp = tempfile.mkdtemp()
          md = m.write_report(payload, os.path.join(tmp, "r.md"))
          html = m.write_report(payload, os.path.join(tmp, "r.html"))
          md_text = open(md, encoding="utf-8").read()
          html_text = open(html, encoding="utf-8").read()
          assert md_text.startswith("# Distillation evaluation"), md_text[:80]
          assert "| Prediction agreement | 65.50% | **71.15%** | 100% |" in md_text, md_text
          assert html_text.startswith("<!doctype html>"), html_text[:60]

          # Theme correctness: the artifact renders in the viewer's theme, and a
          # palette defined ONLY inside a media query leaves the un-stamped state
          # painting one theme's text on the other theme's ground.
          assert "prefers-color-scheme: dark" in html_text
          assert '[data-theme="dark"]' in html_text
          assert "--paper:#FBFBFD" in html_text, "light palette not on bare :root"

          # The headline number and the gap bar must both reflect the payload.
          assert '<div class="big">40%' in html_text, "gap-recovered headline missing"
          assert 'class="seg-gain"' in html_text, "gap bar missing"

          # No generation_similarity -> that section is simply absent.
          assert "Free-running similarity" not in md_text
          assert "Free-running similarity" not in html_text

          # With it, the section appears in both formats.
          payload["generation_similarity"] = {
              "prompts": 50, "max_new_tokens": 64,
              "bertscore_f1_base": 0.8712, "bertscore_f1_distilled": 0.8815,
              "rougeL_base": 0.2639, "rougeL_distilled": 0.3041}
          md_text = open(m.write_report(payload, os.path.join(tmp, "r2.md")),
                         encoding="utf-8").read()
          assert "Free-running similarity" in md_text, md_text

          # The plain-English summary must name the wording/meaning split, which is
          # the finding a reader is most likely to misread from the raw numbers.
          summary = " ".join(m.plain_summary(payload))
          assert "The training worked" in summary, summary
          assert "WORDING" in summary and "MEANING" in summary, summary
          print("readable report OK")

          print("evaluation metrics OK")
          PY
          echo "evaluation harness OK"

      - name: Verify the comparison UI entrypoint
        run: |
          # A function-local import of a name already imported at module scope makes
          # that name local to the WHOLE function, so any earlier use in the same
          # function raises UnboundLocalError. This shipped once and broke the
          # distilled-student column while the teacher column loaded fine.
          uv run python - <<'PY'
          import ast
          tree = ast.parse(open("app.py", encoding="utf-8").read())
          module_names = set()
          for n in tree.body:
              if isinstance(n, (ast.Import, ast.ImportFrom)):
                  for a in n.names:
                      module_names.add(a.asname or a.name.split(".")[0])
          bad = []
          for fn in (n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)):
              for n in ast.walk(fn):
                  if isinstance(n, (ast.Import, ast.ImportFrom)):
                      for a in n.names:
                          name = a.asname or a.name.split(".")[0]
                          if name in module_names:
                              bad.append(f"{fn.name}() re-imports module-level {name!r}")
          assert not bad, bad
          print("no shadowing local imports")
          PY
          uv run python app.py --help | grep -q -- '--adapter'
          uv run python app.py --help | grep -q -- '--port'
          uv run python app.py --list-adapters
          echo "UI entrypoint OK"

  # ---------------------------------------------------------------------------
  # Generate the runner artifact.
  # ---------------------------------------------------------------------------
  build:
    name: Build distill.sh
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect build metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Render distill.sh from template
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
          BUILT_AT: ${{ steps.meta.outputs.built_at }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          template = pathlib.Path("scripts/distill.sh.template").read_text(encoding="utf-8")
          subs = {
              "__REPO_URL__":  os.environ["REPO_URL"],
              "__REPO__":      os.environ["REPO"],
              "__SHA__":       os.environ["SHA"],
              "__SHA_SHORT__": os.environ["SHA_SHORT"],
              "__BUILT_AT__":  os.environ["BUILT_AT"],
          }
          for key, value in subs.items():
              template = template.replace(key, value)
          missing = [k for k in subs if k in template]
          if missing:
              raise SystemExit(f"Unsubstituted placeholders remain: {missing}")
          out = pathlib.Path("distill.sh")
          out.write_text(template, encoding="utf-8")
          out.chmod(0o755)
          print(f"rendered distill.sh ({out.stat().st_size} bytes)")
          PY

      - name: Shellcheck the rendered runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2086: intentional word splitting is not used here; keep the check strict
          # but allow "info"-level style notes so the build is not blocked by nits.
          shellcheck --severity=warning distill.sh

      - name: Verify it parses, and --help / --version work
        run: |
          bash -n distill.sh

          # REGRESSION: the usage() heredoc MUST use a quoted delimiter. Unquoted,
          # the shell expands the help text, so a backticked example such as
          # `hf auth login` is EXECUTED - and --help hangs on an interactive login
          # prompt for every user who has that CLI on PATH. It does not reproduce
          # on this runner (hf is not installed here), which is exactly why it
          # needs a static check and not only a behavioural one.
          grep -q "cat <<'EOF'" distill.sh \
            || { echo "FAIL: usage() heredoc is not quoted; help text would be expanded"; exit 1; }

          # --help must terminate promptly with stdin closed.
          timeout 20 ./distill.sh --help < /dev/null > /tmp/help.txt \
            || { echo "FAIL: --help did not exit within 20s"; exit 1; }
          grep -q -- '--teacher' /tmp/help.txt
          grep -q -- '--evaluate' /tmp/help.txt
          grep -q -- '--tasks' /tmp/help.txt
          # Escapes and backticks must survive as literal text, not be expanded.
          grep -q 'hf auth login' /tmp/help.txt
          grep -q '[$]HOME/.cache/kd-runner' /tmp/help.txt

          timeout 20 ./distill.sh --version < /dev/null | grep -q "${{ github.sha }}" \
            || timeout 20 ./distill.sh --version < /dev/null | grep -q "${{ steps.meta.outputs.sha_short }}"
          echo "help/version OK"

      - name: Verify every helper used is defined, and output is plain text
        run: |
          set -e
          # A helper that is called but never defined fails at runtime with
          # "command not found". Because these sit inside `case` arms, nothing
          # exercises them until a user reaches that mode - this shipped once,
          # so --check and --smoke printed nothing where a banner belonged.
          missing=0
          for fn in log warn die ok bad banner_ok banner_bad field need_val usage; do
            if ! grep -qE "^${fn}\(\)" distill.sh; then
              echo "FAIL: ${fn}() is called but never defined"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # The banners must actually render.
          awk '/^RULE=/{f=1} f{print} /^field\(\)/{c=1} c&&/^}/{exit}' distill.sh > /tmp/helpers.sh
          out=$(bash -c '. /tmp/helpers.sh; banner_ok "test"; ok "  detail"' 2>&1)
          case "$out" in
            *"ALL OK - test"*) ;;
            *) echo "FAIL: banner_ok did not render: $out"; exit 1 ;;
          esac
          out=$(bash -c '. /tmp/helpers.sh; banner_bad "boom"' 2>&1)
          case "$out" in
            *"FAILED - boom"*) ;;
            *) echo "FAIL: banner_bad did not render: $out"; exit 1 ;;
          esac
          out=$(bash -c '. /tmp/helpers.sh; field " teacher       : org/model" teacher')
          [ "$out" = "org/model" ] || { echo "FAIL: field() returned '$out'"; exit 1; }

          # Plain text only: ANSI escapes do not survive every terminal or log.
          if grep -q '\\033\[' distill.sh; then
            echo "FAIL: ANSI escape sequences found; output must be plain text"
            exit 1
          fi
          echo "helpers OK"

      - name: Verify CLI parsing and precedence
        run: |
          set -e
          # Truncate the runner just before it touches the network, then assert on the
          # values the argument parser resolved.
          awk '/^#  1\. Platform detection/{exit} {print}' distill.sh > /tmp/parsecheck.sh
          cat >> /tmp/parsecheck.sh <<'EOF'
          echo "teacher=$TEACHER_MODEL"
          echo "student=$STUDENT_MODEL"
          echo "dataset=$DATASET"
          echo "steps=$MAX_STEPS"
          echo "mode=$MODE"
          echo "tasks=$EVAL_TASKS"
          echo "samples=$EVAL_SAMPLES"
          echo "report=$EVAL_REPORT"
          echo "adapter=$TEACHER_ADAPTER"
          echo "profile=$CONFIG_PROFILE"
          echo "explicit=$PROFILE_EXPLICIT"
          echo "port=$UI_PORT"
          echo "host=$UI_HOST"
          EOF

          expect() { echo "$1" | grep -qx "$2" || { echo "FAIL: expected '$2' in:"; echo "$1"; exit 1; }; }

          out=$(bash /tmp/parsecheck.sh --teacher a/T --student a/S --dataset a/D --steps 600)
          expect "$out" "teacher=a/T"; expect "$out" "student=a/S"
          expect "$out" "dataset=a/D"; expect "$out" "steps=600"

          out=$(bash /tmp/parsecheck.sh -t s/T -s s/S -d s/D)
          expect "$out" "teacher=s/T"; expect "$out" "student=s/S"; expect "$out" "dataset=s/D"

          out=$(bash /tmp/parsecheck.sh --teacher=eq/T --steps=42)
          expect "$out" "teacher=eq/T"; expect "$out" "steps=42"

          # CLI must win over the KD_* environment fallback
          out=$(KD_TEACHER_MODEL=env/T KD_MAX_STEPS=123 bash /tmp/parsecheck.sh)
          expect "$out" "teacher=env/T"; expect "$out" "steps=123"
          out=$(KD_TEACHER_MODEL=env/T KD_MAX_STEPS=123 bash /tmp/parsecheck.sh --teacher cli/T --steps 777)
          expect "$out" "teacher=cli/T"; expect "$out" "steps=777"

          # REGRESSION: with no flags the runner must leave these EMPTY, so the
          # selected profile's YAML values win. Non-empty defaults here get exported
          # as KD_* variables, which outrank the config file and silently override it
          # (this clobbered configs/finance.yaml with the SmolLM2 defaults).
          out=$(bash /tmp/parsecheck.sh)
          expect "$out" "teacher="; expect "$out" "student="
          expect "$out" "dataset="; expect "$out" "steps="

          # Teacher verification mode and the adapter flag
          out=$(bash /tmp/parsecheck.sh --check-teacher)
          expect "$out" "mode=check-teacher"
          out=$(bash /tmp/parsecheck.sh --fix-teacher)
          expect "$out" "mode=fix-teacher"
          out=$(bash /tmp/parsecheck.sh --convert-adapter --teacher-adapter org/a)
          expect "$out" "mode=convert-adapter"; expect "$out" "adapter=org/a"
          out=$(bash /tmp/parsecheck.sh --teacher Q/B --teacher-adapter ./lora)
          expect "$out" "teacher=Q/B"; expect "$out" "adapter=./lora"
          out=$(bash /tmp/parsecheck.sh --teacher-adapter=eq/A)
          expect "$out" "adapter=eq/A"
          out=$(bash /tmp/parsecheck.sh); expect "$out" "adapter="

          # --smoke must not clobber an explicitly requested profile, or the
          # projected run time would describe a different model pair entirely.
          out=$(bash /tmp/parsecheck.sh --smoke)
          expect "$out" "explicit=0"
          out=$(bash /tmp/parsecheck.sh --profile qwen-poc --smoke)
          expect "$out" "explicit=1"; expect "$out" "profile=qwen-poc"

          # Evaluation mode and its options
          out=$(bash /tmp/parsecheck.sh --evaluate)
          expect "$out" "mode=evaluate"
          out=$(bash /tmp/parsecheck.sh --evaluate --report /tmp/r.html)
          expect "$out" "report=/tmp/r.html"
          out=$(bash /tmp/parsecheck.sh --evaluate --report=/tmp/r.md)
          expect "$out" "report=/tmp/r.md"
          out=$(bash /tmp/parsecheck.sh); expect "$out" "report="
          out=$(bash /tmp/parsecheck.sh --evaluate --tasks ifeval --eval-samples 100)
          expect "$out" "tasks=ifeval"; expect "$out" "samples=100"
          out=$(bash /tmp/parsecheck.sh --evaluate --tasks=a,b --eval-samples=7)
          expect "$out" "tasks=a,b"; expect "$out" "samples=7"
          out=$(bash /tmp/parsecheck.sh); expect "$out" "tasks="; expect "$out" "samples="

          # UI mode and its options
          out=$(bash /tmp/parsecheck.sh); expect "$out" "mode=train"
          out=$(bash /tmp/parsecheck.sh --ui --port 8080 --host 0.0.0.0)
          expect "$out" "mode=ui"; expect "$out" "port=8080"; expect "$out" "host=0.0.0.0"
          echo "parsing + precedence OK"

      - name: Verify bad input is rejected
        run: |
          set -e
          fails() {
            if ./distill.sh "$@" >/dev/null 2>&1; then
              echo "FAIL: '$*' should have been rejected"; exit 1
            fi
          }
          fails --device gpu
          fails --dtype int8
          fails --steps abc
          fails --profile nope
          fails --teacher
          fails --teacher-adapter
          fails --publish
          fails --bogus
          fails stray-arg
          fails --ui --port abc
          fails --eval-samples abc
          fails --eval-limit xyz
          fails --tasks
          fails --report
          echo "validation OK"

      - name: Upload runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: distill-runner-${{ steps.meta.outputs.sha_short }}
          path: |
            distill.sh
            configs/
          retention-days: 90
          if-no-files-found: error

      - name: Attach runner to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: distill.sh

      - name: Job summary
        run: |
          {
            echo "### Distillation runner built"
            echo
            echo "**Artifact:** \`distill-runner-${{ steps.meta.outputs.sha_short }}\`"
            echo "**Pinned to:** \`${{ github.sha }}\`"
            echo
            echo '```bash'
            echo "unzip distill-runner-${{ steps.meta.outputs.sha_short }}.zip"
            echo "chmod +x distill.sh"
            echo "./distill.sh --help      # all options"
            echo "./distill.sh --check          # verify hardware + resolved config"
            echo "./distill.sh --check-teacher  # verify the teacher is fit to distil from"
            echo "./distill.sh --fix-teacher    # repair a mislabelled checkpoint"
            echo "./distill.sh --teacher HuggingFaceTB/SmolLM2-1.7B-Instruct"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
