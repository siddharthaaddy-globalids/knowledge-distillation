name: Build distillation runner

# Produces `distill.sh` and `distill.ps1` - self-contained bootstrappers pinned to
# the commit they were built from. Download one, point it at a config, and run it
# on any machine: Linux, macOS (Apple Silicon), a CUDA box, or Windows.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Validate the source before shipping a runner that fetches it.
  #
  # Everything here is cheap and offline. The expensive checks a real run does -
  # loading the teacher, building the dataset - belong to the pipeline itself,
  # which is what the smoke profile exists for.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Byte-compile every module
        run: uv run python -m compileall -q src/kd

      - name: Import every module
        # An import error in a module the pipeline only reaches at stage 5 would
        # otherwise surface after the teacher download.
        run: |
          uv run python - <<'PY'
          import importlib, sys
          modules = ["kd.config", "kd.runlog", "kd.cli", "kd.limits", "kd.pipeline",
                     "kd.data", "kd.train", "kd.evaluate", "kd.report",
                     "kd.teacher", "kd.teacher_fix", "kd.adapters", "kd.publish",
                     "kd.ui.compare", "kd.ui.control"]
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append(f"{name}: {type(exc).__name__}: {exc}")
          for line in failed:
              print(f"FAIL {line}")
          print(f"{len(modules) - len(failed)}/{len(modules)} modules import")
          sys.exit(1 if failed else 0)
          PY

      - name: Configuration
        run: uv run python tests/test_config.py

      - name: Run bundles
        run: uv run python tests/test_runlog.py

      - name: Pipeline gating and limits
        run: uv run python tests/test_pipeline.py

      - name: Runner templates and the stage contract
        run: uv run python tests/test_runners.py

      - name: Every profile resolves
        run: |
          for cfg in configs/*.yaml; do
            case "$cfg" in */_base.yaml) continue ;; esac
            echo "--- $cfg"
            uv run python -m kd check --config "$cfg" >/dev/null \
              || { echo "FAILED to resolve $cfg"; exit 1; }
          done

      - name: Stage names agree between the config and the code
        # configs/_base.yaml names the stages a run performs and kd.pipeline
        # implements them. A stage listed in one and missing from the other is a
        # run that either skips a step silently or dies partway through it.
        run: |
          uv run python - <<'PY'
          import sys, yaml
          from kd.pipeline import STAGES
          declared = [s["name"] for s in
                      yaml.safe_load(open("configs/_base.yaml", encoding="utf-8"))
                      ["pipeline"]["stages"]]
          missing = [n for n in declared if n not in STAGES]
          unused = [n for n in STAGES if n not in declared]
          if missing:
              print(f"declared in _base.yaml but not implemented: {missing}")
          if unused:
              print(f"implemented but not in _base.yaml: {unused}")
          print(f"{len(declared)} stages: {', '.join(declared)}")
          sys.exit(1 if missing or unused else 0)
          PY

      - name: Override precedence holds
        # _base < profile < KD_* < --set < flag. Getting this wrong means a run
        # silently trains something other than what was asked for.
        run: |
          uv run python - <<'PY'
          import os, sys
          from kd.config import load_config

          def steps(**kwargs):
              return load_config("configs/smoke.yaml", **kwargs)["training"]["max_steps"]

          checks = []
          os.environ["KD_MAX_STEPS"] = "111"
          checks.append(("env beats profile", steps(use_env=True), 111))
          checks.append(("--set beats env",
                         steps(use_env=True, set_overrides=["training.max_steps=222"]), 222))
          checks.append(("flag beats --set",
                         steps(use_env=True, set_overrides=["training.max_steps=222"],
                               flag_overrides={"training.max_steps": 333}), 333))
          del os.environ["KD_MAX_STEPS"]
          checks.append(("profile beats base", steps(use_env=False), 2))

          bad = [(what, got, want) for what, got, want in checks if got != want]
          for what, got, want in checks:
              print(f"  {'ok ' if got == want else 'FAIL'} {what}: {got} (want {want})")
          sys.exit(1 if bad else 0)
          PY

      - name: Unknown config keys are rejected
        run: |
          uv run python - <<'PY'
          import sys
          from kd.config import ConfigError, load_config
          open("configs/_ci_typo.yaml", "w").write(
              "extends: _base.yaml\ntraining:\n  max_stepz: 5\n")
          try:
              load_config("configs/_ci_typo.yaml", use_env=False)
          except ConfigError as exc:
              assert "max_steps" in str(exc), f"no suggestion offered: {exc}"
              print("rejected with a suggestion, as intended")
              sys.exit(0)
          finally:
              import os; os.unlink("configs/_ci_typo.yaml")
          print("FAIL: a typo was accepted")
          sys.exit(1)
          PY

      - name: Wrapped tool entrypoints are reachable
        # Each of these owns its own flags; the CLI passes arguments through to
        # them rather than restating them, so what matters is that the
        # passthrough still lands somewhere real.
        run: |
          for cmd in evaluate check-teacher fix-teacher convert-adapter publish; do
            uv run python -m kd "$cmd" --help >/dev/null \
              || { echo "FAILED: kd $cmd --help"; exit 1; }
          done
          uv run python -m kd --help >/dev/null
          uv run python -m kd doctor --config configs/smoke.yaml >/dev/null

  # ---------------------------------------------------------------------------
  # Build both runners from the templates and prove they parse and dispatch.
  # ---------------------------------------------------------------------------
  build:
    name: Build runners
    needs: validate
    runs-on: ubuntu-latest
    # Wider than the workflow default because the release event attaches the built
    # runners to the release. Scoped to this job so the validate job stays read-only.
    permissions:
      contents: write
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect build metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Render distill.sh and distill.ps1
        env:
          SHA: ${{ github.sha }}
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
          BUILT_AT: ${{ steps.meta.outputs.built_at }}
          REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          # Both runners are rendered from the same four substitutions, in one
          # step, so a change to how the pinning works cannot reach one platform
          # and miss the other.
          for ext in sh ps1; do
            sed -e "s|__SHA__|${SHA}|g" \
                -e "s|__SHA_SHORT__|${SHA_SHORT}|g" \
                -e "s|__BUILT_AT__|${BUILT_AT}|g" \
                -e "s|__REPO_URL__|${REPO_URL}|g" \
                -e "s|__REPO__|${REPO}|g" \
                "scripts/distill.${ext}.template" > "distill.${ext}"
          done
          chmod +x distill.sh

      - name: No placeholder survived the substitution
        # A leftover __SHA__ produces a runner that clones and then fails to check
        # anything out, which is a confusing way to discover a broken build.
        run: |
          if grep -n '__[A-Z_]\+__' distill.sh distill.ps1; then
            echo "FAILED: unsubstituted placeholders above"
            exit 1
          fi
          echo "all placeholders substituted"

      - name: Shellcheck distill.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning distill.sh

      - name: distill.sh parses, and its own flags work
        run: |
          bash -n distill.sh
          ./distill.sh --runner-help | grep -q 'bootstrapper'
          ./distill.sh --runner-version | grep -q "${{ steps.meta.outputs.sha_short }}"

      - name: distill.sh dispatches correctly
        # The runner's only real decision is which pipeline command it invokes.
        # KD_DISPATCH_ONLY makes it print that and stop, so the mapping can be
        # checked without a clone, a torch download or a GPU.
        run: |
          probe() {
            KD_DISPATCH_ONLY=1 ./distill.sh "$@" 2>/dev/null | tail -1
          }
          expect() {
            want="$1"; shift
            got="$(probe "$@")"
            if [ "$got" != "$want" ]; then
              echo "FAIL: ./distill.sh $* -> '$got', wanted '$want'"
              exit 1
            fi
            echo "  ok  ./distill.sh $* -> $got"
          }
          expect "pipeline"                                    # bare
          expect "pipeline --config configs/smoke.yaml"        --config configs/smoke.yaml
          expect "pipeline --config x.yaml --set a.b=1"        --config x.yaml --set a.b=1
          expect "pipeline --only train"                       --only train
          expect "train --config x.yaml"                       train --config x.yaml
          expect "evaluate --config x.yaml"                    evaluate --config x.yaml
          expect "doctor"                                      doctor

      - name: Install PowerShell
        run: |
          sudo apt-get install -y -qq wget apt-transport-https software-properties-common
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq powershell

      - name: distill.ps1 parses
        # A PowerShell syntax error would otherwise only be discovered by the
        # first Windows user to download the runner.
        run: |
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "./distill.ps1", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
            Write-Host "distill.ps1 parses"'

      - name: distill.ps1 runner flags work
        run: |
          pwsh -NoProfile -File ./distill.ps1 -RunnerHelp | grep -q 'bootstrapper'
          pwsh -NoProfile -File ./distill.ps1 -RunnerVersion \
            | grep -q "${{ steps.meta.outputs.sha_short }}"

      - name: distill.ps1 dispatches identically to distill.sh
        # The two runners are only worth having if they agree. This checks the
        # same cases as the bash dispatch test above.
        run: |
          probe() {
            KD_DISPATCH_ONLY=1 pwsh -NoProfile -File ./distill.ps1 "$@" 2>/dev/null | tail -1
          }
          expect() {
            want="$1"; shift
            got="$(probe "$@")"
            if [ "$got" != "$want" ]; then
              echo "FAIL: distill.ps1 $* -> '$got', wanted '$want'"
              exit 1
            fi
            echo "  ok  distill.ps1 $* -> $got"
          }
          expect "pipeline"                                    # bare
          expect "pipeline --config configs/smoke.yaml"        -Config configs/smoke.yaml
          expect "pipeline --config x.yaml --set a.b=1"        --set a.b=1 -Config x.yaml
          expect "pipeline --only train"                       --only train
          expect "train --config x.yaml"                       train -Config x.yaml
          expect "doctor"                                      doctor

      - name: Upload runners
        uses: actions/upload-artifact@v4
        with:
          name: distill-runner-${{ steps.meta.outputs.sha_short }}
          path: |
            distill.sh
            distill.ps1
          if-no-files-found: error

      - name: Attach runners to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            distill.sh
            distill.ps1

      - name: Job summary
        run: |
          {
            echo "### Runners built from \`${{ steps.meta.outputs.sha_short }}\`"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Linux, macOS, containers | \`distill.sh\` |"
            echo "| Windows | \`distill.ps1\` |"
            echo
            echo '```'
            echo './distill.sh --config configs/finance.yaml'
            echo '.\distill.ps1 -Config configs\finance.yaml'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
